<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاكسين</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المشاكسين">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  :root{
    --bg: #EFE9DC;
    --bg-course: #E8F4F8;
    --paper: #FFFFFF;
    --ink: #24303A;
    --ink-soft: #64707C;
    --line: #DED4BE;
    --gold: #1F6F5C;
    --gold-soft: #DCEDE7;
    --radius: 14px;
  }
  
  /* Dark Mode */
  body.dark-mode{
    --bg: #1a1d23;
    --bg-course: #1e2834;
    --paper: #252b36;
    --ink: #e8eaed;
    --ink-soft: #9aa0a6;
    --line: #3c4149;
    --gold: #4db6ac;
    --gold-soft: #2d3e3a;
  }
  
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Cairo', sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s;}
  body.ltr{direction:ltr;}
  body.course-view{background:var(--bg-course);}
  h1,h2,h3,.display{font-family:'Amiri', serif;}
  .mono{font-family:'IBM Plex Mono', monospace; direction:ltr; display:inline-block;}
  button{font-family:inherit; cursor:pointer;}

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .seal{
    width:44px; height:44px; border-radius:50%; overflow:hidden; flex-shrink:0;
    border:2px solid var(--gold); box-shadow:0 2px 8px rgba(0,0,0,.18); background:#fdfcf9;
  }
  .brand .seal-img{ width:100%; height:100%; object-fit:cover; display:block; }
  .brand-text h1{margin:0; font-size:22px; font-weight:800; font-family:'Baloo Bhaijaan 2','Amiri',serif; letter-spacing:.2px;}
  .brand-text p{margin:0; font-size:11px; color:var(--ink-soft); letter-spacing:.5px;}
  .header-right{display:flex; align-items:center; gap:10px;}
  .theme-toggle, .lang-switch{
    background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:700; color:var(--gold);
    transition:.2s;
  }
  .theme-toggle:hover, .lang-switch:hover{background:var(--gold); color:#fff;}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--gold-soft);
    color:var(--gold); display:flex; align-items:center; justify-content:center;
    font-weight:600; border:1.5px solid var(--gold); font-size:18px; padding:0; line-height:1;
  }
  .bell-btn{
    position:relative; width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:var(--gold-soft); border:1.5px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:15px; padding:0;
  }
  .bell-btn:hover{background:var(--gold); color:#fff;}
  .bell-badge{
    position:absolute; top:-4px; left:-4px; background:#B23A48; color:#fff; font-size:10px;
    font-weight:700; min-width:16px; height:16px; border-radius:999px; align-items:center;
    justify-content:center; padding:0 3px; border:1.5px solid var(--paper); display:none;
  }
  body.ltr .bell-badge{left:auto; right:-4px;}
  .bell-badge.show{display:flex;}

  /* Header dropdown panels (notifications / settings) */
  .dropdown-panel{
    position:absolute; top:64px; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:500; overflow:hidden;
    display:none;
  }
  .dropdown-panel.show{display:block;}
  #notifPanel{right:20px; width:300px; max-width:88vw;}
  body.ltr #notifPanel{right:auto; left:20px;}
  #settingsPanel{right:20px; width:220px;}
  body.ltr #settingsPanel{right:auto; left:20px;}
  .panel-head{padding:12px 16px; font-weight:700; font-size:14px; border-bottom:1px solid var(--line); background:var(--gold-soft); color:var(--gold);}
  .panel-body{max-height:320px; overflow-y:auto;}
  .notif-row{display:flex; gap:10px; align-items:flex-start; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px;}
  .notif-row:last-child{border-bottom:none;}
  .notif-row .ni-icon{font-size:16px; flex-shrink:0;}
  .notif-row .ni-title{font-weight:700; margin-bottom:2px;}
  .notif-row .ni-sub{color:var(--ink-soft); font-size:11.5px;}
  .notif-empty{padding:20px 16px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .avatar-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:12px 14px;}
  .avatar-opt{
    width:32px; height:32px; border-radius:50%; border:1.5px solid transparent; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:16px; padding:0;
  }
  .avatar-opt.active{border-color:var(--gold); background:var(--gold-soft);}

  /* ===== Notification Toast ===== */
  .notification-toast{
    position:fixed; top:80px; right:20px; background:var(--paper);
    border:1px solid var(--gold); border-left:5px solid var(--gold);
    border-radius:12px; padding:14px 18px; box-shadow:0 4px 20px rgba(0,0,0,0.15);
    z-index:1000; max-width:350px; animation:slideInRight 0.3s ease;
    display:none;
  }
  body.ltr .notification-toast{right:auto; left:20px; border-left:1px solid var(--gold); border-right:5px solid var(--gold);}
  .notification-toast.show{display:block;}
  @keyframes slideInRight{
    from{transform:translateX(400px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  .notification-toast .notif-title{font-weight:700; font-size:14px; margin-bottom:4px;}
  .notification-toast .notif-body{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .notification-toast .notif-close{
    position:absolute; top:8px; right:8px; background:transparent; border:none;
    color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px;
  }
  body.ltr .notification-toast .notif-close{right:auto; left:8px;}

  /* ===== Layout ===== */
  .app{max-width:1180px; margin:0 auto; padding:20px 16px 60px;}

  main{min-width:0;}

  /* Stats row */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:640px){ .stats{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stat-card .value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right;}
  body.ltr .stat-card .value{text-align:left;}
  .stat-card .value small{font-size:14px; font-weight:400; color:var(--ink-soft);}
  .stat-card .countdown{font-size:12.5px; font-weight:700; margin-top:7px; color:var(--gold);}
  .stat-card .countdown:empty{display:none;}
  .stat-card .countdown.soon{color:#C1542D;}
  .stat-card .countdown.urgent{color:#B23A48; animation:pulseUrgent 1.6s ease-in-out infinite;}
  @keyframes pulseUrgent{0%,100%{opacity:1;} 50%{opacity:.55;}}

  section{margin-bottom:30px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .section-head h2{font-size:20px; margin:0;}
  .section-head span{font-size:12px; color:var(--ink-soft);}
  .section-head .add-btn, .export-btn{
    background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:600;
  }
  .export-btn{background:transparent; border:1.5px solid var(--gold); color:var(--gold);}
  .export-btn:hover{background:var(--gold); color:#fff;}

  /* Quick links (dashboard shortcuts to each dedicated page) */
  .quick-links{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .quick-link-card{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px 14px;
    text-align:center; cursor:grab; transition:.15s; border-top:4px solid var(--qc, var(--gold));
    touch-action:none; user-select:none;
  }
  .quick-link-card:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,42,56,.08); }
  .quick-link-card:active{ cursor:grabbing; }
  .quick-link-card.dragging{ opacity:.35; }
  .quick-link-card .qc-icon{ font-size:26px; margin-bottom:8px; }
  .quick-link-card .qc-label{ font-size:13px; font-weight:700; color:var(--ink); }
  .quick-link-card .qc-hint{ font-size:9.5px; color:var(--ink-soft); margin-top:4px; opacity:.6; }

  /* Study schedule dashboard widget */
  .sched-widget{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:0 4px 16px rgba(30,42,56,.05); }
  .sched-week-strip{ display:flex; gap:7px; margin-bottom:18px; }
  .sw-day{
    flex:1; text-align:center; padding:10px 2px; border-radius:14px; background:var(--bg);
    font-size:12px; font-weight:600; color:var(--ink-soft); border:1.5px solid transparent; transition:.15s;
  }
  .sw-day.has-session{ background:var(--gold-soft); color:var(--gold); font-weight:800; }
  .sw-day.is-today{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
  .sched-upcoming{ display:flex; flex-direction:column; gap:10px; }
  .su-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px;
    background:var(--bg); transition:.15s;
  }
  .su-item:hover{ background:var(--gold-soft); }
  .su-item .su-icon{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; color:#fff; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .su-item .su-info{ flex:1; min-width:0; }
  .su-item .su-name{ font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .su-item .su-meta{ font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; margin-top:2px; }
  .su-item .su-time{ font-family:'IBM Plex Mono',monospace; direction:ltr; }
  .sched-empty-dash{ text-align:center; padding:24px; color:var(--ink-soft); font-size:13px; }

  .clock-chip{ margin:2px 0 0; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right; }
  body.ltr .clock-chip{ text-align:left; }

  /* Daily motivational quote strip */
  .quote-strip{
    display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, var(--gold-soft), var(--paper));
    border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-size:13px;
    color:var(--ink); margin-bottom:20px; font-weight:600;
  }
  .quote-strip .qs-icon{ font-size:16px; flex-shrink:0; }

  /* Scroll to top button */
  #scrollTopBtn{
    position:fixed; bottom:22px; left:22px; width:42px; height:42px; border-radius:50%;
    background:var(--ink); color:var(--gold-soft); border:none; font-size:18px; font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,.22); cursor:pointer; display:none; align-items:center; justify-content:center;
    z-index:400; transition:opacity .2s, transform .2s;
  }
  body.ltr #scrollTopBtn{ left:auto; right:22px; }
  #scrollTopBtn.show{ display:flex; }
  #scrollTopBtn:hover{ transform:translateY(-3px); }

  /* Schedule widget: daily progress bar */
  .sw-progress-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .sw-progress-track{ height:7px; border-radius:999px; background:var(--bg); overflow:hidden; margin-bottom:14px; }
  .sw-progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold), var(--gold-soft)); transition:width .3s; }

  /* Schedule widget: per-item checkbox, subject tag, now/next badge */
  .su-item{ position:relative; }
  .su-check{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--line); background:var(--paper);
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
    padding:0;
  }
  .su-check.checked{ background:var(--gold); border-color:var(--gold); }
  .su-item.done .su-name{ text-decoration:line-through; color:var(--ink-soft); }
  .su-item.done{ opacity:.65; }
  .su-tag{
    font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:999px; flex-shrink:0;
  }
  .su-now{
    font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:#2E9E5B; color:#fff;
    flex-shrink:0; animation:pulseNow 1.6s infinite;
  }
  .su-next{
    font-size:9.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--gold); color:#fff; flex-shrink:0;
  }
  @keyframes pulseNow{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  .sw-more{
    text-align:center; font-size:12px; color:var(--gold); font-weight:700; padding:10px 0 2px; cursor:pointer;
  }
  .sw-more:hover{ text-decoration:underline; }


  /* Faculty switcher */
  .faculty-switch{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .fac-btn{
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .fac-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

  /* Timeline (study schedule) */
  .timeline{position:relative; padding-right:20px;}
  body.ltr .timeline{padding-right:0; padding-left:20px;}
  .timeline::before{content:""; position:absolute; right:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  body.ltr .timeline::before{right:auto; left:6px;}
  .t-item{position:relative; display:flex; gap:14px; align-items:flex-start; padding-bottom:20px;}
  .t-item::before{content:""; position:absolute; right:-1px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--tc, var(--gold)); border:2px solid var(--bg);}
  body.ltr .t-item::before{right:auto; left:-1px;}
  .t-time{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:56px; flex-shrink:0; direction:ltr; text-align:left;}
  .t-card{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-right:4px solid var(--tc, var(--gold));
  }
  body.ltr .t-card{ border-right:1px solid var(--line); border-left:4px solid var(--tc, var(--gold)); }
  .t-card .t-info{flex:1; display:flex; flex-direction:column; gap:4px; align-items:flex-start;}
  .t-card .name{font-weight:600; font-size:14px;}
  .t-card .t-del{
    background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px; flex-shrink:0;
  }
  .t-card .t-del:hover{ color:#B0522D; background:#F6E6DB; }
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap;}

  /* Day group divider in schedule */
  .day-divider{
    display:flex; align-items:center; gap:10px; margin:18px 0 10px;
    font-size:13px; font-weight:700; color:var(--gold);
  }
  .day-divider:first-child{ margin-top:0; }
  .day-divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .day-divider-date{ font-weight:500; color:var(--ink-soft); font-size:11.5px; }

  /* Course cards */
  .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .course-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; border-right:5px solid var(--c); cursor:pointer; transition:.15s;
    display:flex; flex-direction:column; gap:10px;
  }
  body.ltr .course-card{border-right:1px solid var(--line); border-left:5px solid var(--c);}
  .course-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,42,56,.08);}
  .course-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .course-card h3{margin:0; font-size:16px; font-weight:700; font-family:'Cairo';}
  .course-card .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); direction:ltr; display:inline-block;}
  .tag{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; background:var(--cbg); color:var(--c);}
  .progress-track{height:6px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--c); border-radius:999px; transition:width .4s ease;}
  .course-card .meta{font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between;}

  /* Standalone course page */
  #coursePage{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:18px;
  }
  .back-btn:hover{ color:var(--ink); }
  .course-hero{
    background:var(--c-bg, var(--gold-soft)); border-radius:var(--radius); padding:22px 22px 20px;
    border-right:5px solid var(--c-page, var(--gold)); margin-bottom:26px;
  }
  body.ltr .course-hero{border-right:1px solid transparent; border-left:5px solid var(--c-page, var(--gold));}
  .course-hero .tag{ background:var(--paper); color:var(--c-page, var(--gold)); }
  .course-hero h2{ margin:8px 0 2px; font-size:26px; }
  .course-hero .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .course-hero .progress-track{ height:8px; }
  .course-hero .progress-fill{ background:var(--c-page, var(--gold)); }
  .cp-section{ margin-bottom:26px; }
  .cp-section h3{ font-size:16px; margin:0 0 12px; }
  .cp-empty{ font-size:13px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:16px; text-align:center; }

  /* Lecture accordion */
  .lecture-card{ 
    background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;
    transition:.2s;
  }
  .lecture-card.open{ border-color:var(--c-page, var(--gold)); }
  .lecture-card.reading-mode .lecture-body{
    max-width:700px; margin:0 auto; font-size:16px; line-height:1.8; padding:20px;
  }
  .lecture-head{ display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; }
  .lecture-check{ width:18px; height:18px; accent-color:var(--c-page, var(--gold)); flex-shrink:0; cursor:pointer; }
  .lecture-title{ flex:1; font-size:14px; font-weight:600; }
  .lecture-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .lecture-dur{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr; }
  .lecture-icons{ font-size:20px; display:flex; gap:4px; }
  .lecture-badge{
    width:42px; height:42px; border-radius:50%; background:var(--c-bg, var(--gold-soft));
    color:var(--c-page, var(--gold)); display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; flex-shrink:0; transition:.2s;
  }
  .lecture-body{ padding:14px 14px 16px; border-top:1px solid var(--line); animation:slideDown .3s ease; }
  @keyframes slideDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

  .files-list{
    display:flex; flex-direction:column; gap:8px; margin-bottom:12px;
  }
  .attach-chip{
    display:flex; align-items:center; gap:12px;
    font-size:13px; background:var(--c-bg, var(--gold-soft));
    color:var(--c-page, var(--gold)); padding:12px 14px; border-radius:10px;
    text-decoration:none; cursor:pointer; border:1px solid transparent;
    transition:.2s; position:relative;
  }
  .attach-chip:hover{ border-color:var(--c-page, var(--gold)); transform:translateX(-2px); }
  body.ltr .attach-chip:hover{ transform:translateX(2px); }
  .attach-chip .file-icon{ font-size:28px; flex-shrink:0; }
  .attach-chip .file-name{ flex:1; font-weight:500; word-break:break-word; }
  .attach-chip .file-del{
    background:rgba(255,255,255,0.9); border:none;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--ink-soft); cursor:pointer; opacity:0; transition:.2s; flex-shrink:0;
  }
  .attach-chip:hover .file-del{ opacity:1; }
  .attach-chip .file-del:hover{ color:#B0522D; background:#fff; }

  .reading-mode-toggle{
    background:transparent; border:1.5px solid var(--gold); color:var(--gold);
    border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; margin-bottom:10px;
  }
  .reading-mode-toggle:hover{background:var(--gold); color:#fff;}

  /* Upload */
  .upload-row{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 12px; }
  .upload-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1.5px dashed var(--c-page, var(--gold));
    color:var(--c-page, var(--gold)); border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:600;
  }
  .upload-btn:hover{ background:var(--c-bg, var(--gold-soft)); }
  .upload-status{ font-size:11.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5; }
  
  /* Add lecture button & form */
  .add-lecture-btn{
    background:transparent; border:1.5px dashed var(--c-page, var(--gold)); color:var(--c-page, var(--gold));
    border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; width:100%; margin-top:8px;
  }
  .add-lecture-btn:hover{ background:var(--c-bg, var(--gold-soft)); }
  .lecture-form{
    background:var(--c-bg, var(--gold-soft)); border:1px solid var(--c-page, var(--gold)); border-radius:12px;
    padding:14px; margin-bottom:10px; display:flex; flex-direction:column; gap:10px;
  }
  .lecture-form input, .lecture-form textarea{
    border:1px solid var(--c-page, var(--gold)); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--paper); color:var(--ink); width:100%;
  }
  .lecture-form textarea{resize:vertical; min-height:80px;}
  .lecture-form .form-actions{ display:flex; gap:10px; }
  .lecture-form .btn-save{ background:var(--c-page, var(--gold)); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; }
  .lecture-form .btn-cancel{ background:transparent; border:1px solid var(--c-page, var(--gold)); color:var(--c-page, var(--gold)); border-radius:999px; padding:9px 18px; font-size:13px; }

  /* Assignments */
  .assign-list{display:flex; flex-direction:column; gap:8px;}
  .assign{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
    transition:opacity .45s ease, transform .45s ease;
  }
  .assign.urgent{border-left:4px solid #e74c3c;}
  body.ltr .assign.urgent{border-left:1px solid var(--line); border-right:4px solid #e74c3c;}
  .assign .a-left{display:flex; align-items:center; gap:12px; flex:1; min-width:0;}
  .assign .a-check{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--line); background:var(--paper);
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
    padding:0;
  }
  .assign .a-check.checked{ background:var(--gold); border-color:var(--gold); }
  .assign .info{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .assign .a-title{font-weight:800; font-size:16px; color:var(--ink);}
  .assign .a-course{font-size:12px; color:var(--ink-soft);}
  .assign .due{font-size:12px; font-weight:600; font-family:'IBM Plex Mono',monospace; direction:ltr;}
  .assign .a-right{ display:flex; align-items:center; gap:10px; }
  .assign .a-delete{
    background:transparent; border:none; color:var(--ink-soft); font-size:16px; line-height:1;
    padding:4px 6px; border-radius:6px;
  }
  .assign .a-delete:hover{ color:#B0522D; background:#F6E6DB; }
  .assign.done{ opacity:.55; }
  .assign.done .a-title{ text-decoration:line-through; color:var(--ink-soft); font-weight:700; }

  .assign-empty-state{ text-align:center; padding:40px 20px; }
  .assign-empty-state .aes-icon{ font-size:44px; margin-bottom:10px; }
  .assign-empty-state .aes-text{ font-size:14px; color:var(--ink-soft); font-weight:600; }

  .add-btn{
    background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:600;
  }
  .assign-form, .schedule-form{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px;
    margin-bottom:14px; display:flex; flex-direction:column; gap:10px;
  }
  .assign-form input, .assign-form select, .schedule-form input, .schedule-form select{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--bg); color:var(--ink); width:100%;
  }
  .assign-form label, .schedule-form label{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .assign-form .form-actions, .schedule-form .form-actions{ display:flex; gap:10px; margin-top:4px; }
  .assign-form .btn-save, .schedule-form .btn-save{ background:var(--gold); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; }
  .assign-form .btn-cancel, .schedule-form .btn-cancel{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:9px 18px; font-size:13px; }

  /* Day checkboxes in schedule form */
  .day-checks{ display:flex; flex-wrap:wrap; gap:8px; }
  .day-check-item{
    display:flex; align-items:center; gap:5px; background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .day-check-item input{ accent-color:var(--gold); }
  .day-check-item .day-check-date{ font-size:10.5px; color:var(--ink-soft); }
  .t-topic{ font-size:14px; font-weight:600; color:var(--ink); margin-top:2px; }

  /* Exams */
  .exam-card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;
    border-right:4px solid var(--ex, var(--gold));
  }
  body.ltr .exam-card{border-right:1px solid var(--line); border-left:4px solid var(--ex, var(--gold));}
  .exam-card .info{display:flex; flex-direction:column; gap:3px;}
  .exam-card .e-course{font-weight:600; font-size:14px;}
  .exam-card .e-meta{font-size:11.5px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
  .exam-type-badge{font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:700; background:var(--exbg, var(--gold-soft)); color:var(--ex, var(--gold));}
  .exam-card .e-date{font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--ex, var(--gold));}
  .exam-card .e-right{display:flex; align-items:center; gap:10px;}
  .exam-card .e-delete{background:transparent; border:none; color:var(--ink-soft); font-size:16px; padding:4px 6px; border-radius:6px;}
  .exam-card .e-delete:hover{ color:#B0522D; background:#F6E6DB; }

  /* Grades */
  .grade-card{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:12px; border-right:4px solid var(--gc, var(--gold));
  }
  body.ltr .grade-card{border-right:1px solid var(--line); border-left:4px solid var(--gc, var(--gold));}
  .grade-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .grade-course-title{ font-size:14px; font-weight:700; }
  .grade-total{ font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--gc, var(--gold)); }
  .grade-rows{ display:flex; flex-direction:column; gap:8px; }
  .grade-row{ display:flex; align-items:center; gap:8px; }
  .grade-label{ font-size:12.5px; color:var(--ink-soft); width:70px; flex-shrink:0; }
  .grade-input{
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px;
    font-family:'IBM Plex Mono',monospace; background:var(--bg); color:var(--ink); width:100%; text-align:center;
  }
  .grade-input.small{ max-width:56px; }
  .grade-slash{ color:var(--ink-soft); font-size:13px; }
  .grade-del{
    background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px; flex-shrink:0;
  }
  .grade-del:hover{ color:#B0522D; background:#F6E6DB; }
  .add-quiz-btn{
    background:transparent; border:1px dashed var(--gc, var(--gold)); color:var(--gc, var(--gold));
    border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; margin-top:8px;
  }

  footer{text-align:center; padding:24px; font-size:12px; color:var(--ink-soft);}
</style>
</head>

/* تخزين الملفات نفسها جوه Firestore (مجاني تمامًا، بدون Storage) — محدود بحجم صغير لكل ملف */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = () => reject(new Error(lang==='ar' ? 'تعذّرت قراءة الملف' : 'Could not read file'));
    r.readAsDataURL(file);
  });
}

async function uploadFileToFirestore(file){
  const base64 = await fileToBase64(file);
  const fileId = 'f' + Date.now() + Math.random().toString(36).slice(2,8);
  await setDoc(doc(db, 'files', fileId), {
    name: file.name, type: file.type || '', size: file.size, data: base64
  });
  return fileId;
}

async function openStoredFile(fileId, fallbackType, fallbackName){
  try{
    const snap = await getDoc(doc(db, 'files', fileId));
    if(!snap.exists()){
      alert(lang==='ar' ? 'الملف مش موجود (يمكن اتحذف)' : 'File not found (may have been deleted)');
      return;
    }
    const data = snap.data();
    const byteChars = atob(data.data);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0; i<byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: data.type || fallbackType || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(err){
    console.error('Open file failed:', err);
    alert((lang==='ar' ? 'تعذّر فتح الملف: ' : 'Could not open file: ') + err.message);
  }
}

function dayName(dayIndex){

}

function getTodayDate(){
  const d = new Date();
  const months_ar = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const months_en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = d.getDate();
  const month = lang==='ar' ? months_ar[d.getMonth()] : months_en[d.getMonth()];
  return lang==='ar' ? `${day} ${month}` : `${month} ${day}`;
}

function formatDateStr(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months_ar = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const months_en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = d.getDate();
  const month = lang==='ar' ? months_ar[d.getMonth()] : months_en[d.getMonth()];
  const year = d.getFullYear();
  return lang==='ar' ? `${day} ${month} ${year}` : `${month} ${day}, ${year}`;
}

/* نسخة مختصرة من التاريخ (يوم + شهر بدون سنة) — تُستخدم جنب اسم اليوم في جدول المذاكرة */
function formatDateShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months_ar = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const months_en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const month = lang==='ar' ? months_ar[d.getMonth()] : months_en[d.getMonth()];
  return `${d.getDate()} ${month}`;
}

/* تحويل وقت الحصة من صيغة 24 ساعة (HH:MM) لصيغة 12 ساعة سهلة القراءة */
function formatTime12(timeStr){
  if(!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const period = lang==='ar' ? (h < 12 ? 'ص' : 'م') : (h < 12 ? 'AM' : 'PM');
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  const mm = String(m||0).padStart(2,'0');
  return `${h12}:${mm} ${period}`;
}

/* المسافة بالدقايق من دلوقتي لحد أقرب حدوث لليوم ده والوقت ده (جدول أسبوعي متكرر) */
function minutesUntilNext(dayIndex, timeStr){
  const now = new Date();
  const [h,m] = timeStr.split(':').map(Number);
  const currentDay = now.getDay();
  const currentMinutes = now.getHours()*60 + now.getMinutes();
  const targetMinutes = h*60 + (m||0);
  let dayDiff = (dayIndex - currentDay + 7) % 7;
  let total = dayDiff*24*60 + (targetMinutes - currentMinutes);
  if(total < 0) total += 7*24*60;
  return total;
}

  toast.classList.add('show');

function checkUpcomingAssignments(){
  const urgentAssignments = assignments.filter(a => {
    if(a.faculty !== currentFaculty) return false;
    return a.urgent && !a.done;
  });
  
  if(urgentAssignments.length > 0){
    const body = S('notifUrgent').replace('{count}', urgentAssignments.length);
    showNotification(S('notifUpcoming'), body);
  }
  updateBellBadge();
}

function daysUntilDate(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - today) / (1000*60*60*24));
}

function getNotifItems(){
  const items = [];
  assignments.filter(a=>a.faculty===currentFaculty && a.urgent && !a.done).forEach(a=>{
    const course = courses.find(c=>c.id===a.courseId);
    items.push({icon:'✅', title:L(a.title), sub:(course ? L(course.title)+' · ' : '') + formatDateStr(a.due)});
  });
  const todayStr = toLocalISODate(new Date());
  exams.filter(x=>x.faculty===currentFaculty && x.date >= todayStr).forEach(x=>{
    const dleft = daysUntilDate(x.date);
    if(dleft <= 7){
      const course = courses.find(c=>c.id===x.courseId);
      const soon = dleft===0 ? (lang==='ar' ? ' · النهاردة' : ' · Today') : (lang==='ar' ? ` · بعد ${dleft} يوم` : ` · in ${dleft}d`);
      items.push({icon:'📝', title:course ? L(course.title) : '', sub: formatDateStr(x.date) + soon});
    }
  });
  return items;
}

function renderNotifPanel(){
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  const items = getNotifItems();
  panel.innerHTML = `
    <div class="panel-head">${S('notifTitle')}</div>
    <div class="panel-body">
      ${items.length ? items.map(it=>`
        <div class="notif-row">
          <span class="ni-icon">${it.icon}</span>
          <div>
            <div class="ni-title">${it.title}</div>
            <div class="ni-sub">${it.sub}</div>
          </div>
        </div>
      `).join('') : `<div class="notif-empty">${S('notifEmpty')}</div>`}
    </div>`;
}

function updateBellBadge(){
  const badge = document.getElementById('bellBadge');
  if(!badge) return;

  badge.textContent = count > 9 ? '9+' : count;
  badge.classList.toggle('show', count > 0);

function exportData(){

  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ufuq-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showNotification('✅', S('exportSuccess'), 3000);
}

document.getElementById('importInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const imported = JSON.parse(ev.target.result);
      applyState(imported);
      saveState();
      showNotification('✅', S('importSuccess'), 3000);
      location.reload();
    }catch(err){
      alert('❌ خطأ في قراءة الملف');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function buildState(){
  const doneMap = {};
  const filesMap = {};
  const lessonsMap = {};
  const notesMap = {};
  courses.forEach(c=>{
    doneMap[c.id] = c.lessons.map(l=>l.done);
    filesMap[c.id] = {};
    c.lessons.forEach((l,i)=>{ filesMap[c.id][i] = l.files || []; });
    lessonsMap[c.id] = c.lessons.map(l=>({t:l.t, d:l.d}));
    notesMap[c.id] = c.lessons.map(l=>l.notes || '');
  });
  return {
    _writerId: CLIENT_ID,
    assignments, nextAssignmentId, schedule, nextScheduleId, exams, nextExamId, gradesData,
    doneMap, filesMap, lessonsMap, notesMap
  };
}

function applyState(state){
  if(!state) return;
  if(Array.isArray(state.assignments)){
    assignments.length = 0;
    state.assignments.forEach(a=>assignments.push(a));
  }
  if(typeof state.nextAssignmentId === 'number') nextAssignmentId = state.nextAssignmentId;
  if(Array.isArray(state.schedule)){
    schedule.length = 0;
    state.schedule.forEach(s=>schedule.push(s));
  }
  if(typeof state.nextScheduleId === 'number') nextScheduleId = state.nextScheduleId;
  if(Array.isArray(state.exams)){
    exams.length = 0;
    state.exams.forEach(x=>exams.push(x));
  }
  if(typeof state.nextExamId === 'number') nextExamId = state.nextExamId;
  if(state.gradesData) Object.assign(gradesData, state.gradesData);
  if(state.lessonsMap){
    courses.forEach(c=>{
      const arr = state.lessonsMap[c.id];
      if(arr && arr.length > 0){
        c.lessons = arr.map(l=>({t:l.t, d:l.d, done:false, files:[], notes:''}));
      }
    });
  }
  if(state.doneMap){
    courses.forEach(c=>{
      const arr = state.doneMap[c.id];
      if(arr) c.lessons.forEach((l,i)=>{ if(arr[i] !== undefined) l.done = arr[i]; });
    });
  }
  if(state.filesMap){
    courses.forEach(c=>{
      const obj = state.filesMap[c.id];
      if(obj){
        c.lessons.forEach((l,i)=>{
          if(obj[i]) l.files = obj[i];
        });
      }
    });
  }
  if(state.notesMap){
    courses.forEach(c=>{
      const arr = state.notesMap[c.id];
      if(arr){
        c.lessons.forEach((l,i)=>{
          if(arr[i] !== undefined) l.notes = arr[i];
        });
      }
    });
  }
}

const LOCAL_PREFS_KEY = 'ufuq_local_prefs_v1';

function saveLocalPrefs(){
  try{
    localStorage.setItem(LOCAL_PREFS_KEY, JSON.stringify({lang, darkMode, currentFaculty, currentView, avatarEmoji, quickLinksOrder}));
  }catch(e){ console.error('Local prefs save failed:', e); }

function loadLocalPrefs(){
  try{
    const raw = localStorage.getItem(LOCAL_PREFS_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p.lang) lang = p.lang;
    if(p.darkMode !== undefined){
      darkMode = p.darkMode;
      document.body.classList.toggle('dark-mode', darkMode);
      document.getElementById('themeToggle').textContent = darkMode ? '☀️' : '🌙';
    }
    if(p.currentFaculty) currentFaculty = p.currentFaculty;
    if(p.currentView) currentView = p.currentView;
    if(p.avatarEmoji){
      avatarEmoji = p.avatarEmoji;
      const btn = document.getElementById('avatarBtn');
      if(btn) btn.textContent = avatarEmoji;
    }
    if(Array.isArray(p.quickLinksOrder) && p.quickLinksOrder.length) quickLinksOrder = p.quickLinksOrder;
  }catch(e){ console.error('Local prefs load failed:', e); }
}

async function saveState(){
  const state = buildState();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('Local save failed:', e); }
  if(db){
    try{
      await setDoc(stateDocRef(), state);
    }catch(e){
      console.error('Firebase save failed:', e);
      showNotification('⚠️ Firebase', (e.code || '') + ' — ' + (e.message || String(e)), 8000);
    }
  }
}

async function loadState(){
  let state = null;
  if(db){
    try{
      const snap = await getDoc(stateDocRef());
      if(snap.exists()) state = snap.data();
    }catch(e){
      console.error('Firebase load failed:', e);
      showNotification('⚠️ Firebase', (e.code || '') + ' — ' + (e.message || String(e)), 8000);
    }
  }
  if(!state){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){ console.error('Local load failed:', e); }
  }
  applyState(state);
}

function startRealtimeSync(){
  if(!db) return;
  onSnapshot(stateDocRef(), (snap)=>{
    if(!snap.exists()) return;
    const remoteData = snap.data();
    if(remoteData._writerId === CLIENT_ID) return; // ده تحديث احنا اللي عملناه، تجاهله

const gradesData = {};

function getCourseGrades(courseId){
  if(!gradesData[courseId]){
    gradesData[courseId] = {
      quizzes: [{label:(lang==='ar'?'كويز 1':'Quiz 1'), score:'', max:10}],
      midterm: {score:'', max:30},
      final:   {score:'', max:50},
    };
  }
  return gradesData[courseId];
}

function computeTotal(g){
  let scoreSum = 0, maxSum = 0;
  (g.quizzes || []).forEach(q=>{
    const s = parseFloat(q.score), m = parseFloat(q.max);
    if(!isNaN(m) && m > 0) maxSum += m;
    if(!isNaN(s)) scoreSum += s;
  });
  ['midterm','final'].forEach(p=>{
    const s = parseFloat(g[p].score), m = parseFloat(g[p].max);
    if(!isNaN(m) && m > 0) maxSum += m;
    if(!isNaN(s)) scoreSum += s;
  });
  if(maxSum === 0) return null;
  return {scoreSum, maxSum, pct: Math.round((scoreSum/maxSum)*100)};
}

function gradeRowHtml(courseId, part, label, obj, extra=''){
  return `
    <div class="grade-row">
      <span class="grade-label">${label}</span>
      <input type="number" class="grade-input" placeholder="${lang==='ar'?'الدرجة':'Score'}" value="${obj.score}" data-grade="${courseId}|${part}|score" inputmode="decimal">
      <span class="grade-slash">/</span>
      <input type="number" class="grade-input small" placeholder="${lang==='ar'?'من':'Max'}" value="${obj.max}" data-grade="${courseId}|${part}|max" inputmode="decimal">
      ${extra}
    </div>`;
}

function renderGradesList(facCourses){
  const list = facCourses || courses.filter(c=>c.faculty===currentFaculty);
  const wrap = document.getElementById('gradesList');
  if(!wrap) return;
  if(list.length === 0){
    wrap.innerHTML = `<div class="cp-empty">${S('empty_grades')}</div>`;
    return;
  }

  wrap.innerHTML = list.map(course=>{
    const th = THEME[course.subject];
    const g = getCourseGrades(course.id);
    const total = computeTotal(g);
    const quizRows = g.quizzes.map((q,qi)=>gradeRowHtml(
      course.id, `quiz-${qi}`, q.label, q,
      `<button class="grade-del" data-del-quiz="${course.id}|${qi}" title="✕">✕</button>`
    )).join('');
    return `
      <div class="grade-card" style="--gc:${th.c}; --gcbg:${th.bg}">
        <div class="grade-card-head">
          <span class="grade-course-title">${L(course.title)}</span>
          <span class="grade-total" id="total-${course.id}">${total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—'}</span>
        </div>
        <div class="grade-rows" id="quizRows-${course.id}">${quizRows}</div>
        <button class="add-quiz-btn" data-add-quiz="${course.id}">${lang==='ar'?'+ إضافة كويز':'+ Add Quiz'}</button>
        <div class="grade-rows" style="margin-top:10px;">
          ${gradeRowHtml(course.id, 'midterm', lang==='ar'?'ميد تيرم':'Midterm', g.midterm)}
          ${gradeRowHtml(course.id, 'final', lang==='ar'?'فاينال':'Final', g.final)}
        </div>
      </div>`;
  }).join('');

  function updateTotalDisplay(courseId){
    const total = computeTotal(gradesData[courseId]);
    const totalEl = document.getElementById(`total-${courseId}`);
    if(totalEl) totalEl.textContent = total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—';
  }

  let gradeSaveTimer = null;
  wrap.querySelectorAll('[data-grade]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [courseId, part, field] = inp.dataset.grade.split('|');
      if(part.startsWith('quiz-')){
        const qi = +part.split('-')[1];
        gradesData[courseId].quizzes[qi][field] = inp.value;
      }else{
        gradesData[courseId][part][field] = inp.value;
      }
      updateTotalDisplay(courseId);
      clearTimeout(gradeSaveTimer);
      gradeSaveTimer = setTimeout(()=>{ saveState(); }, 900);
    });
  });

  wrap.querySelectorAll('[data-add-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const courseId = btn.dataset.addQuiz;
      const n = gradesData[courseId].quizzes.length + 1;
      gradesData[courseId].quizzes.push({label: (lang==='ar'?'كويز ':'Quiz ') + n, score:'', max:10});
      renderGradesList(list);
      saveState();
    });
  });

  wrap.querySelectorAll('[data-del-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [courseId, qi] = btn.dataset.delQuiz.split('|');
      gradesData[courseId].quizzes.splice(+qi, 1);
      if(gradesData[courseId].quizzes.length === 0){
        gradesData[courseId].quizzes.push({label: lang==='ar'?'كويز 1':'Quiz 1', score:'', max:10});
      }
      renderGradesList(list);
      saveState();
    });
  });
}

  if(!wrap) return;
  const today = new Date().getDay();
  let facSchedule = schedule.filter(s=>s.faculty===currentFaculty);
  facSchedule = [...facSchedule].sort((a,b)=>
    ((a.dayIndex - today + 7) % 7) - ((b.dayIndex - today + 7) % 7) || a.time.localeCompare(b.time)
  );

  if(facSchedule.length === 0){
    wrap.innerHTML = `<div class="cp-empty">${S('empty_schedule')}</div>`;

  let html = '';

  facSchedule.forEach(s=>{
    const isCustom = s.courseId === '__custom__';
    const course = isCustom ? null : courses.find(c=>c.id===s.courseId);
    if(!isCustom && !course) return;
    if(s.dayIndex !== lastDay){
      html += `<div class="day-divider">${dayName(s.dayIndex)} <span class="day-divider-date">· ${formatDateShort(occurrenceDateStr(s.dayIndex))}</span></div>`;
      lastDay = s.dayIndex;

    const topicText = s.topic ? L(s.topic) : '';

/* تنسيق تاريخ محلي بصيغة YYYY-MM-DD من غير تحويل لتوقيت UTC (toISOString بيرجع يوم غلط في المناطق اللي بعد UTC) */
function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* تاريخ أقرب حدوث ليوم الأسبوع ده (يُستخدم كجزء من مفتاح التخزين عشان يتصفّر تلقائيًا كل أسبوع) */
function occurrenceDateStr(dayIndex){
  const now = new Date();
  const diff = (dayIndex - now.getDay() + 7) % 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  return toLocalISODate(d);
}

/* بطاقة معاينة جدول المذاكرة في لوحة التحكم — شريط أيام الأسبوع + شريط إنجاز + أقرب المحاضرات */
function renderScheduleWidget(){
  const wrap = document.getElementById('schedWidgetBody');
  if(!wrap) return;

  let facSchedule = schedule.filter(s=>s.faculty===currentFaculty);
  const today = new Date().getDay();
  facSchedule = facSchedule.map(s=>({
    ...s,
    _dist: minutesUntilNext(s.dayIndex, s.time),
    _date: occurrenceDateStr(s.dayIndex)
  }));
  facSchedule.sort((a,b)=>
    ((a.dayIndex - today + 7) % 7) - ((b.dayIndex - today + 7) % 7) || a.time.localeCompare(b.time)
  );

  const daysWithSession = new Set(facSchedule.map(s=>s.dayIndex));
  const stripHtml = [0,1,2,3,4,5,6].map(i=>{
    const label = lang==='ar' ? SHORT_DAYS_AR[i] : DAYS_EN[i].slice(0,2);
    return `<div class="sw-day ${daysWithSession.has(i) ? 'has-session' : ''} ${i===today ? 'is-today' : ''}">${label}</div>`;
  }).join('');

  // شريط الإنجاز اليومي: عدد حصص النهاردة اللي خلصت
  const todaysSessions = facSchedule.filter(s=>s.dayIndex === today);
  let progressHtml = '';
  if(todaysSessions.length > 0){
    const todaysDone = todaysSessions.filter(s=>completedSessions[`${currentFaculty}_${s.id}_${s._date}`]).length;
    const pct = Math.round((todaysDone / todaysSessions.length) * 100);
    const progressText = lang==='ar'
      ? `تم إنهاء ${todaysDone} من أصل ${todaysSessions.length} دروس اليوم`
      : `${todaysDone} of ${todaysSessions.length} sessions done today`;
    progressHtml = `
      <div class="sw-progress-row"><span>${progressText}</span><span>${pct}%</span></div>
      <div class="sw-progress-track"><div class="sw-progress-fill" style="width:${pct}%"></div></div>`;
  }

  let listHtml;
  const shown = facSchedule.slice(0,4);
  if(facSchedule.length === 0){
    listHtml = `<div class="sched-empty-dash">${S('empty_schedule')}</div>`;
  }else{
    listHtml = shown.map((s,idx)=>{
      const isCustom = s.courseId === '__custom__';
      const course = isCustom ? null : courses.find(c=>c.id===s.courseId);
      if(!isCustom && !course) return '';
      const th = isCustom ? THEME.custom : THEME[course.subject];
      const titleText = isCustom ? L(s.customTitle) : L(course.title);
      const initial = titleText.trim().charAt(0);
      const key = `${currentFaculty}_${s.id}_${s._date}`;
      const isDone = !!completedSessions[key];

      let statusBadge = '';
      if(!isDone){
        if(s._dist <= 0 && s._dist > -90){
          statusBadge = `<span class="su-now">${lang==='ar'?'جارية الآن':'Now'}</span>`;
        }else if(idx === 0 && s._dist > 0 && s._dist <= 24*60){
          statusBadge = `<span class="su-next">${lang==='ar'?'القادمة':'Next'}</span>`;
        }
      }

      return `
        <div class="su-item ${isDone?'done':''}">
          <button class="su-check ${isDone?'checked':''}" data-check-key="${key}" title="${lang==='ar'?'تم':'Done'}">${isDone?'✓':''}</button>
          <div class="su-icon" style="background:${th.c}">${initial}</div>
          <div class="su-info">
            <div class="su-name">${titleText}</div>
            <div class="su-meta">
              <span class="su-time">${formatTime12(s.time)}</span>
              <span>·</span>
              <span>${dayName(s.dayIndex)}</span>
              ${s.topic ? `<span>· 📖 ${L(s.topic)}</span>` : ''}
            </div>
          </div>
          ${statusBadge}
        </div>`;
    }).join('');

    const remaining = facSchedule.length - shown.length;
    if(remaining > 0){
      const moreText = lang==='ar'
        ? `+${remaining} حصة تانية — اضغط لعرض الجدول كامل`
        : `+${remaining} more sessions — tap to view full schedule`;
      listHtml += `<div class="sw-more" data-nav="schedule">${moreText}</div>`;
    }
  }

  wrap.innerHTML = `${progressHtml}<div class="sched-week-strip">${stripHtml}</div><div class="sched-upcoming">${listHtml}</div>`;

  wrap.querySelectorAll('[data-check-key]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = btn.dataset.checkKey;
      completedSessions[key] = !completedSessions[key];
      saveCompletedSessions();
      renderScheduleWidget();
    });
  });
}

function getFileIcon(file){

  if(['pdf'].includes(ext)) return '📄';
  if(['mp3','wav','m4a','ogg'].includes(ext)) return '🎙️';
  if(['mp4','avi','mov','mkv'].includes(ext)) return '🎬';
  if(['jpg','jpeg','png','gif','svg'].includes(ext)) return '🖼️';
  if(['doc','docx'].includes(ext)) return '📝';
  if(['xls','xlsx'].includes(ext)) return '📊';
  if(['ppt','pptx'].includes(ext)) return '📽️';
  if(['zip','rar','7z'].includes(ext)) return '📦';
  return '📎';
}

/* ===== تفويض الأحداث (Event Delegation): ربط دائم مرة واحدة، بيشتغل مهما اتغيّر محتوى الصفحة ===== */

document.addEventListener('click', (e)=>{
  // رجوع من صفحة المادة
  if(e.target.closest('#backBtn')){ history.back(); return; }

  // زرار "إضافة محاضرة"
  if(e.target.closest('#addLectureBtn')){
    const course = getCurrentCourse();
    if(course) toggleAddLectureForm(course);
    return;
  }
  if(e.target.closest('#saveLectureBtn')){
    const course = getCurrentCourse();
    if(course) saveNewLecture(course);
    return;
  }
  if(e.target.closest('#cancelLectureBtn')){
    showAddLectureForm = false;
    const wrap = document.getElementById('addLectureFormWrap');
    if(wrap) wrap.innerHTML = '';
    return;
  }

  // فتح/قفل المحاضرة (accordion)
  const toggleEl = e.target.closest('[data-toggle]');
  if(toggleEl){
    const course = getCurrentCourse();
    if(course){
      const i = +toggleEl.dataset.toggle;
      expandedLecture = (expandedLecture === i) ? null : i;
      refreshLectureList(course);
    }
    return;
  }

  // زرار رفع ملف (بيفتح اختيار الملف)
  const fileBtnEl = e.target.closest('[id^="fileUploadBtn-"]');
  if(fileBtnEl){
    const li = fileBtnEl.id.split('-')[1];
    const inputEl = document.getElementById('fileInput-'+li);
    if(inputEl) inputEl.click();
    return;
  }

  // إضافة رابط ملف كبير (Google Drive وغيره)
  const driveBtnEl = e.target.closest('[id^="driveLinkBtn-"]');
  if(driveBtnEl){
    const li = driveBtnEl.id.split('-')[1];
    const course = getCurrentCourse();
    const input = document.getElementById('driveLinkInput-'+li);
    const nameInput = document.getElementById('driveNameInput-'+li);
    if(course && input){
      const url = input.value.trim();
      if(!url){ alert(lang==='ar' ? 'الصق رابط الملف الأول' : 'Paste the file link first'); return; }
      if(!course.lessons[li].files) course.lessons[li].files = [];
      let fname = (nameInput && nameInput.value.trim()) || '';
      if(!fname){
        fname = url;
        try{ fname = decodeURIComponent(url.split('/').pop().split('?')[0]) || url; }catch(e){}
      }
      course.lessons[li].files.push({name: fname.slice(0,60), url, isExternal:true});
      refreshLectureList(course);
      saveState();
    }
    return;
  }

  // وضع القراءة
  const readBtnEl = e.target.closest('[id^="readingModeBtn-"]');
  if(readBtnEl){
    readingMode = !readingMode;
    const course = getCurrentCourse();
    if(course) refreshLectureList(course);
    return;
  }

  // حذف ملف
  const delFileEl = e.target.closest('[data-del-file]');
  if(delFileEl){
    const course = getCurrentCourse();
    if(course){
      const [lectureIdx, fileIdx] = delFileEl.dataset.delFile.split('|').map(Number);
      course.lessons[lectureIdx].files.splice(fileIdx, 1);
      refreshLectureList(course);
      saveState();
    }
    return;
  }

  // فتح ملف مرفوع
  const openFileEl = e.target.closest('[data-open-file]');
  if(openFileEl && !e.target.closest('.file-del')){
    const url = openFileEl.dataset.fileUrl;
    if(url){ window.open(url, '_blank'); }
    else{ openStoredFile(openFileEl.dataset.openFile, openFileEl.dataset.fileType, openFileEl.dataset.fileName); }
    return;
  }

  // حفظ الملاحظات
  const saveNotesEl = e.target.closest('[data-save-notes]');
  if(saveNotesEl){
    const course = getCurrentCourse();
    const idx = +saveNotesEl.dataset.saveNotes;
    const notesArea = document.getElementById('notes-'+idx);
    if(course && notesArea){
      course.lessons[idx].notes = notesArea.value;
      saveState();
      showNotification('✅', lang==='ar'?'تم حفظ الملاحظات':'Notes saved', 2000);
    }
    return;
  }

  // تصدير / استيراد البيانات
  if(e.target.closest('#exportBtn')){ exportData(); return; }

  // كروت الوصول السريع في لوحة التحكم
  const navCardEl = e.target.closest('[data-nav]');
  if(navCardEl){
    if(qlJustDragged) return;
    navigate(navCardEl.dataset.nav);
    return;
  }
  if(e.target.closest('#importBtn')){ importData(); return; }

  // جدول المذاكرة: إضافة / حفظ / إلغاء
  if(e.target.closest('#addSchedBtn')){
    const formEl = document.getElementById('schedForm');
    if(formEl && formEl.style.display === 'flex') closeScheduleForm();
    else openScheduleForm();
    return;
  }
  if(e.target.closest('#saveSchedBtn')){ saveNewSchedule(); return; }
  if(e.target.closest('#cancelSchedBtn')){ closeScheduleForm(); return; }
  const delSchedEl = e.target.closest('[data-del-sched]');
  if(delSchedEl){
    const id = +delSchedEl.dataset.delSched;
    const idx = schedule.findIndex(s=>s.id===id);
    if(idx !== -1) schedule.splice(idx, 1);
    renderSchedule();
    saveState();
    return;
  }

  // جدول الامتحانات: إضافة / حفظ / إلغاء
  if(e.target.closest('#addExamBtn')){
    const formEl = document.getElementById('examForm');
    if(formEl && formEl.style.display === 'flex') closeExamForm();
    else openExamForm();
    return;
  }
  if(e.target.closest('#saveExamBtn')){ saveNewExam(); return; }
  if(e.target.closest('#cancelExamBtn')){ closeExamForm(); return; }
  const delExamEl = e.target.closest('[data-del-exam]');
  if(delExamEl){
    const id = +delExamEl.dataset.delExam;
    const idx = exams.findIndex(x=>x.id===id);
    if(idx !== -1) exams.splice(idx, 1);
    renderExams();
    updateNearestExamStat();
    saveState();
    return;
  }
});

document.addEventListener('change', (e)=>{
  // تحديد محاضرة كمكتملة
  if(e.target.matches('[data-check]')){
    const course = getCurrentCourse();
    if(course){
      const i = +e.target.dataset.check;
      course.lessons[i].done = e.target.checked;
      renderCourses();
      refreshLectureList(course);
      const pctEl = document.getElementById('cpPct');
      const fillEl = document.getElementById('cpProgressFill');
      if(pctEl) pctEl.textContent = pct(course) + '%';
      if(fillEl) fillEl.style.width = pct(course) + '%';
      saveState();
    }
    return;
  }

  // رفع ملف فعليًا بعد اختياره
  if(e.target.id && e.target.id.startsWith('fileInput-')){
    const li = +e.target.id.split('-')[1];
    const course = getCurrentCourse();
    if(course) handleFileUpload(e, course, li);
    return;
  }
});

async function handleFileUpload(e, course, li){
  const files = Array.from(e.target.files);
  if(files.length === 0) return;
  const statusEl = document.getElementById(`uploadStatus-${li}`);

  for(const file of files){
    if(file.size > MAX_FILE_SIZE){
      statusEl.textContent = S('fileTooBig');
      continue;
    }

    statusEl.textContent = S('uploadingFile');

    try{
      if(db){
        const fileId = await uploadFileToFirestore(file);
        if(!course.lessons[li].files) course.lessons[li].files = [];
        course.lessons[li].files.push({name:file.name, type:file.type||'', size:file.size, fileId});
        statusEl.textContent = S('uploadedLocal');
      }else{
        const url = URL.createObjectURL(file);
        if(!course.lessons[li].files) course.lessons[li].files = [];
        course.lessons[li].files.push({name:file.name, url, size:file.size});
        statusEl.textContent = lang==='ar' ? 'تم الرفع مؤقتًا بس (مفيش اتصال بقاعدة البيانات) — هيتفقد لو قفلت الصفحة' : 'Uploaded locally only (no database connection) — will be lost on reload';
      }
    }catch(err){
      console.error('Upload failed:', err);
      statusEl.textContent = '❌ ' + (err.code || '') + ' ' + err.message;
    }
  }
  
  refreshLectureList(course);
  saveState();
  e.target.value = '';
}

function updateDueStat(){
  const el = document.getElementById('dueStat');
  if(!el) return;
  const todayStr = toLocalISODate(new Date());
  const count = assignments.filter(a=>a.faculty===currentFaculty && !a.done && (!a.due || a.due >= todayStr)).length;
  if(count === 0){
    el.textContent = lang==='ar' ? '🎉 مفيش واجبات متأخرة' : '🎉 No pending work';
    el.style.fontSize = '15px';
  }else{
    el.textContent = count;
    el.style.fontSize = '';
  }
}

/* موعد أقرب امتحان (كتاريخ/وقت كامل) — بيتحدث كل ما نعيد حساب الإحصائية، وبيستخدمه العداد التنازلي */
let nearestExamDT = null;

function updateNearestExamStat(){
  const el = document.getElementById('nearestExamStat');
  if(!el) return;
  const todayStr = toLocalISODate(new Date());
  const upcoming = exams
    .filter(x=>x.faculty===currentFaculty && x.date >= todayStr)
    .sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(upcoming.length === 0){
    el.textContent = lang==='ar' ? '📖 لا توجد امتحانات قريبة، استغل الوقت في المذاكرة!' : '📖 No exams coming up, make the most of your time!';
    el.style.fontSize = '13.5px';
    nearestExamDT = null;
    updateExamCountdown();
    updateBellBadge();
    return;
  }
  const x = upcoming[0];
  const course = courses.find(c=>c.id===x.courseId);
  el.textContent = `${course ? L(course.title) : ''} · ${formatDateStr(x.date)}`;
  el.style.fontSize = '15px';
  // لو الامتحان معاه وقت محدد بنستخدمه، لو لأ بنعتبره بداية اليوم عشان العداد يفضل شغال طول يوم الامتحان
  nearestExamDT = new Date(`${x.date}T${x.time || '00:00'}:00`);
  updateExamCountdown();
  updateBellBadge();
}

/* بيحول الفرق الزمني (بالميلي ثانية) لنص زي "باقي 3 أيام و12 ساعة" — بيدي إحساس بالإلحاح كل ما الوقت يقرب */
function formatExamCountdown(diffMs){
  const isAr = lang==='ar';
  if(diffMs <= 0){
    return isAr ? '🔴 الامتحان النهاردة!' : '🔴 Exam is today!';
  }
  const totalMinutes = Math.floor(diffMs / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;

  if(isAr){
    const dayWord = days===1 ? 'يوم واحد' : days===2 ? 'يومين' : days<=10 ? `${days} أيام` : `${days} يوم`;
    const hourWord = hours===1 ? 'ساعة واحدة' : hours===2 ? 'ساعتين' : hours<=10 ? `${hours} ساعات` : `${hours} ساعة`;
    const minWord = minutes===1 ? 'دقيقة واحدة' : minutes===2 ? 'دقيقتين' : minutes<=10 ? `${minutes} دقايق` : `${minutes} دقيقة`;
    if(days > 0) return `⏳ باقي ${dayWord}${hours>0 ? ' و'+hourWord : ''}`;
    if(hours > 0) return `⏳ باقي ${hourWord}${minutes>0 ? ' و'+minWord : ''}`;
    return `⏳ باقي ${minutes>0 ? minWord : 'أقل من دقيقة'}`;
  }else{
    if(days > 0) return `⏳ ${days} day${days!==1?'s':''}${hours>0 ? ' and '+hours+' hour'+(hours!==1?'s':'') : ''} left`;
    if(hours > 0) return `⏳ ${hours} hour${hours!==1?'s':''}${minutes>0 ? ' and '+minutes+' min' : ''} left`;
    return `⏳ ${minutes>0 ? minutes+' min left' : 'Less than a minute left'}`;
  }
}

/* بيرسم نص العداد التنازلي وبيلوّنه حسب قرب الموعد (أحمر لو أقل من يوم، برتقالي لو أقل من 3 أيام) */
function updateExamCountdown(){
  const el = document.getElementById('nearestExamCountdown');
  if(!el) return;
  if(!nearestExamDT){
    el.textContent = '';
    el.className = 'countdown';
    return;
  }
  const diff = nearestExamDT.getTime() - Date.now();
  el.textContent = formatExamCountdown(diff);
  el.className = 'countdown';
  if(diff <= 24*3600000) el.classList.add('urgent');
  else if(diff <= 3*24*3600000) el.classList.add('soon');
}

/* بيحدّث نص العداد كل دقيقة من غير ما يعيد حساب أقرب امتحان من الأول */
function startExamCountdownTicker(){
  updateExamCountdown();
  setInterval(updateExamCountdown, 60000);
}

const QUICK_LINKS = [
  {view:'courses', icon:'📚', key:'tabCourses', color:'#3BA7D9'},
  {view:'schedule', icon:'🗓️', key:'tabSchedule', color:'#1F6F5C'},
  {view:'exams', icon:'📝', key:'tabExams', color:'#B23A48'},
  {view:'assignments', icon:'✅', key:'tabAssignments', color:'#C1542D'},
  {view:'grades', icon:'📊', key:'tabGrades', color:'#6A4FA0'},
];

/* ترتيب كروت الوصول السريع حسب أولوية الطالب — بيتغيّر بالسحب والإفلات وبيتخزن محليًا */
let quickLinksOrder = QUICK_LINKS.map(q=>q.view);
let quickLinksSortable = null;
let qlJustDragged = false;

function getOrderedQuickLinks(){
  const map = {};
  QUICK_LINKS.forEach(q=>{ map[q.view] = q; });
  const ordered = quickLinksOrder.map(v=>map[v]).filter(Boolean);
  QUICK_LINKS.forEach(q=>{ if(!ordered.includes(q)) ordered.push(q); });
  return ordered;
}

function renderQuickLinks(){
  const wrap = document.getElementById('quickLinksGrid');
  if(!wrap) return;
  wrap.innerHTML = getOrderedQuickLinks().map(it=>`
    <div class="quick-link-card" style="--qc:${it.color}" data-nav="${it.view}">
      <div class="qc-icon">${it.icon}</div>
      <div class="qc-label">${S(it.key)}</div>
    </div>
  `).join('');
  initQuickLinksDragDrop();
}

function initQuickLinksDragDrop(){
  const wrap = document.getElementById('quickLinksGrid');
  if(!wrap || typeof Sortable === 'undefined') return;
  if(quickLinksSortable){ quickLinksSortable.destroy(); }
  quickLinksSortable = new Sortable(wrap, {
    animation:150,
    delay:150,
    delayOnTouchOnly:true,
    touchStartThreshold:5,
    ghostClass:'dragging',
    onStart:function(){ qlJustDragged = true; },
    onEnd:function(){
      quickLinksOrder = [...wrap.querySelectorAll('.quick-link-card')].map(c=>c.dataset.nav);
      saveLocalPrefs();
      setTimeout(()=>{ qlJustDragged = false; }, 150);
    }
  });
}

function renderAssignmentsList(){
  const list = document.getElementById('assignList');
  if(!list) return;
  const facAssignments = assignments.filter(a=>a.faculty===currentFaculty);
  if(facAssignments.length === 0){
    list.innerHTML = `
      <div class="assign-empty-state">
        <div class="aes-icon">🎉</div>
        <div class="aes-text">${lang==='ar' ? 'لا توجد واجبات أخرى حالياً، استمتع بوقتك!' : 'No assignments left right now, enjoy your time!'}</div>
      </div>`;
  }else{
    const sorted = [...facAssignments].sort((a,b)=>
      (a.done?1:0) - (b.done?1:0) || (a.due||'').localeCompare(b.due||'')
    );
    list.innerHTML = sorted.map(a=>{
      const course = courses.find(c=>c.id===a.courseId);
      return `
      <div class="assign ${a.urgent?'urgent':''} ${a.done?'done':''}" data-assign-id="${a.id}">
        <div class="a-left">
          <button class="a-check ${a.done?'checked':''}" data-check-assign="${a.id}" title="${lang==='ar'?'تم الانتهاء':'Mark done'}">${a.done?'✓':''}</button>
          <div class="info">
            <span class="a-title">${L(a.title)}</span>
            <span class="a-course">${course ? L(course.title) : ''}</span>
          </div>
        </div>
        <div class="a-right">
          <span class="due" style="color:${a.urgent?'#e74c3c':'#5B6472'}">${formatDateStr(a.due)}</span>
          <button class="a-delete" data-del-assign="${a.id}" title="✕">✕</button>
        </div>
      </div>
    `;}).join('');
    list.querySelectorAll('[data-del-assign]').forEach(btn=>{
      btn.addEventListener('click', ()=>deleteAssignment(+btn.dataset.delAssign));
    });
    list.querySelectorAll('[data-check-assign]').forEach(btn=>{
      btn.addEventListener('click', ()=>toggleAssignmentDone(+btn.dataset.checkAssign));
    });
  }
  updateDueStat();
}

function toggleAssignmentDone(id){
  const a = assignments.find(x=>x.id===id);
  if(!a) return;
  a.done = !a.done;
  saveState();

  const card = document.querySelector(`.assign[data-assign-id="${id}"]`);
  if(!card){ renderAssignmentsList(); return; }

  if(a.done){
    // فيد أوت ناعم قبل ما تتنقل لتحت مع باقي الواجبات المخلّصة
    card.classList.add('done');
    setTimeout(()=>{ renderAssignmentsList(); }, 420);
  }else{
    card.classList.remove('done');
    renderAssignmentsList();
  }
}

function renderAssignmentsPage(){
  const page = document.getElementById('assignmentsPage');
  page.innerHTML = `
    <button class="back-btn" id="assignBack">${S('back')}</button>
    <div class="section-head">
      <h2>${S('tabAssignments')} — ${L(FACULTIES[currentFaculty].short)}</h2>
      <button class="add-btn" id="addAssignBtn">${S('assignBtnFull')}</button>
    </div>
    <div id="assignForm" class="assign-form" style="display:none;"></div>
    <div class="assign-list" id="assignList"></div>
  `;
  page.querySelector('#assignBack').addEventListener('click', ()=>history.back());
  page.querySelector('#addAssignBtn').addEventListener('click', ()=>{
    const formEl = document.getElementById('assignForm');
    if(formEl.style.display === 'flex'){ closeAssignForm(); }
    else{ openAssignForm(); }
  });
  renderAssignmentsList();
}

function deleteAssignment(id){
  const idx = assignments.findIndex(a=>a.id===id);
  if(idx !== -1) assignments.splice(idx, 1);
  renderAssignmentsList();
  checkUpcomingAssignments();
  saveState();
}

function openAssignForm(){
  const facCourses = courses.filter(c=>c.faculty===currentFaculty);
  const formEl = document.getElementById('assignForm');
  formEl.innerHTML = `
    <input type="text" id="newAssignTitle" placeholder="${lang==='ar'?'عنوان الواجب':'Assignment Title'}">
    <select id="newAssignCourse">
      ${facCourses.map(c=>`<option value="${c.id}">${L(c.title)}</option>`).join('')}
    </select>
    <input type="date" id="newAssignDue">
    <label><input type="checkbox" id="newAssignUrgent"> ${lang==='ar'?'عاجل':'Urgent'}</label>
    <div class="form-actions">
      <button class="btn-save" id="saveAssignBtn">${lang==='ar'?'حفظ':'Save'}</button>
      <button class="btn-cancel" id="cancelAssignBtn">${lang==='ar'?'إلغاء':'Cancel'}</button>
    </div>
  `;
  formEl.style.display = 'flex';
  document.getElementById('saveAssignBtn').addEventListener('click', saveNewAssignment);
  document.getElementById('cancelAssignBtn').addEventListener('click', closeAssignForm);
}

function closeAssignForm(){
  const formEl = document.getElementById('assignForm');
  if(!formEl) return;
  formEl.style.display = 'none';
  formEl.innerHTML = '';
}

function saveNewAssignment(){
  const titleInput = document.getElementById('newAssignTitle');
  const courseSelect = document.getElementById('newAssignCourse');
  const dueInput = document.getElementById('newAssignDue');
  const urgentCheck = document.getElementById('newAssignUrgent');

  const titleVal = titleInput.value.trim();
  const courseId = courseSelect.value;
  const dueVal = dueInput.value.trim();
  const urgentVal = urgentCheck.checked;

  if(!titleVal || !dueVal){
    alert(lang==='ar' ? 'اكتب عنوان الواجب واختار تاريخ التسليم' : 'Enter title and select due date');
    return;
  }

  assignments.push({
    id: nextAssignmentId++, 
    title: {ar:titleVal, en:titleVal}, 
    courseId, 
    faculty: currentFaculty, 
    due: dueVal, 
    urgent: urgentVal,
    done: false
  });
  closeAssignForm();
  renderAssignmentsList();
  checkUpcomingAssignments();
  saveState();
}

function applyLanguage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('ltr', lang==='en');

  document.getElementById('brandTitle').textContent = lang==='ar' ? 'المشاكسين' : 'El Mashakseen';
  document.getElementById('brandSubtitle').textContent = S('brandSubtitle');
  document.getElementById('langToggle').textContent = lang==='ar' ? 'EN' : 'عربي';

  document.getElementById('statLabel').textContent = S('dueLabel');
  document.getElementById('nearestExamLabel').textContent = S('nearestExamLabel');
  document.getElementById('quickLinksTitle').textContent = S('quickLinksTitle');
  document.getElementById('schedWidgetTitle').textContent = '📅 ' + S('scheduleTitle');
  document.getElementById('schedWidgetViewAll').textContent = S('viewAll');
  document.getElementById('settingsPanelTitle').textContent = S('settingsTitle');
  document.getElementById('footerText').textContent = S('footerText');
  renderDailyQuote();
  updateBellBadge();

  renderFacultySwitch();
  renderQuickLinks();
  renderCourses();
  renderSchedule();
  renderExams();
  renderAssignmentsList();
  updateDueStat();
  updateNearestExamStat();
  
  if(currentView.view === 'course'){
    renderCoursePageContent(currentView.params.courseId);
  }else if(currentView.view === 'courses'){
    renderCoursesPage();
  }else if(currentView.view === 'schedule'){
    renderSchedulePage();
  }else if(currentView.view === 'exams'){
    renderExamsPage();
  }else if(currentView.view === 'assignments'){
    renderAssignmentsPage();
  }else if(currentView.view === 'grades'){
    renderGradesPage();
  }
}

document.getElementById('langToggle').addEventListener('click', ()=>{
  lang = lang==='ar' ? 'en' : 'ar';
  applyLanguage();
  saveLocalPrefs();
});

async function initApp(){
  loadLocalPrefs();
  loadCompletedSessions();
  await loadState();
  applyLanguage();
  renderDailyQuote();
  startHeaderClock();
  startExamCountdownTicker();
  initScrollTopBtn();
  
  if(currentView && currentView.view){
    showView(currentView.view, currentView.params);
    history.replaceState(currentView, '', '#' + currentView.view);
  }else{
    history.replaceState({view:'dashboard', params:{}}, '', '#dashboard');
  }
  
  checkUpcomingAssignments();
  startRealtimeSync();
}
initApp();
</script>
