<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أفق — منصة الطالب الجامعي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أُفق">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFE9DC;
    --bg-course: #E8F4F8;
    --paper: #FFFFFF;
    --ink: #24303A;
    --ink-soft: #64707C;
    --line: #DED4BE;
    --gold: #1F6F5C;
    --gold-soft: #DCEDE7;
    --radius: 14px;
  }
  
  /* Dark Mode */
  body.dark-mode{
    --bg: #1a1d23;
    --bg-course: #1e2834;
    --paper: #252b36;
    --ink: #e8eaed;
    --ink-soft: #9aa0a6;
    --line: #3c4149;
    --gold: #4db6ac;
    --gold-soft: #2d3e3a;
  }
  
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s;}
  body.ltr{direction:ltr;}
  body.course-view{background:var(--bg-course);}
  h1,h2,h3,.display{font-family:'Amiri', serif;}
  .mono{font-family:'IBM Plex Mono', monospace; direction:ltr; display:inline-block;}
  button{font-family:inherit; cursor:pointer;}

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .seal{
    width:38px; height:38px; border-radius:50%; background:var(--ink);
    color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
    font-family:'Amiri',serif; font-weight:700; font-size:18px; flex-shrink:0;
    border:2px solid var(--gold);
  }
  .brand-text h1{margin:0; font-size:19px; font-weight:700;}
  .brand-text p{margin:0; font-size:11px; color:var(--ink-soft); letter-spacing:.5px;}
  .header-right{display:flex; align-items:center; gap:12px;}
  .theme-toggle, .lang-switch{
    background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:700; color:var(--gold);
    transition:.2s;
  }
  .theme-toggle:hover, .lang-switch:hover{background:var(--gold); color:#fff;}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--gold-soft);
    color:var(--gold); display:flex; align-items:center; justify-content:center;
    font-weight:600; border:1px solid var(--gold); font-size:13px;
  }

  /* ===== Notification Toast ===== */
  .notification-toast{
    position:fixed; top:80px; right:20px; background:var(--paper);
    border:1px solid var(--gold); border-left:5px solid var(--gold);
    border-radius:12px; padding:14px 18px; box-shadow:0 4px 20px rgba(0,0,0,0.15);
    z-index:1000; max-width:350px; animation:slideInRight 0.3s ease;
    display:none;
  }
  body.ltr .notification-toast{right:auto; left:20px; border-left:1px solid var(--gold); border-right:5px solid var(--gold);}
  .notification-toast.show{display:block;}
  @keyframes slideInRight{
    from{transform:translateX(400px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  .notification-toast .notif-title{font-weight:700; font-size:14px; margin-bottom:4px;}
  .notification-toast .notif-body{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .notification-toast .notif-close{
    position:absolute; top:8px; right:8px; background:transparent; border:none;
    color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px;
  }
  body.ltr .notification-toast .notif-close{right:auto; left:8px;}

  /* ===== Layout ===== */
  .app{max-width:1180px; margin:0 auto; padding:20px 16px 60px; display:grid; grid-template-columns:200px 1fr; gap:22px;}
  @media (max-width:800px){ .app{grid-template-columns:1fr;} }

  /* Binder tab nav */
  nav.binder{display:flex; flex-direction:column; gap:6px;}
  .tab{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-radius:0 999px 999px 0; border:1px solid transparent; border-left:none;
    background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500;
    text-align:right; transition:.15s;
  }
  body.ltr .tab{border-radius:999px 0 0 999px; border-left:1px solid transparent; border-right:none;}
  .tab .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0;}
  .tab.active{background:var(--paper); color:var(--ink); font-weight:700; border-color:var(--line); box-shadow:2px 0 0 var(--gold) inset;}
  body.ltr .tab.active{box-shadow:-2px 0 0 var(--gold) inset;}
  .tab.active .dot{background:var(--gold);}
  .tab:hover{background:var(--paper); color:var(--ink);}
  @media (max-width:800px){
    nav.binder{flex-direction:row; overflow-x:auto; padding-bottom:4px;}
    .tab{white-space:nowrap; border-radius:999px; border-left:1px solid transparent;}
    body.ltr .tab{border-radius:999px; border-right:1px solid transparent;}
  }

  main{min-width:0;}

  /* Stats row */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:640px){ .stats{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stat-card .value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right;}
  body.ltr .stat-card .value{text-align:left;}
  .stat-card .value small{font-size:14px; font-weight:400; color:var(--ink-soft);}

  section{margin-bottom:30px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .section-head h2{font-size:20px; margin:0;}
  .section-head span{font-size:12px; color:var(--ink-soft);}
  .section-head .add-btn, .export-btn{
    background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:600;
  }
  .export-btn{background:transparent; border:1.5px solid var(--gold); color:var(--gold);}
  .export-btn:hover{background:var(--gold); color:#fff;}

  /* Faculty switcher */
  .faculty-switch{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .fac-btn{
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .fac-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

  /* Timeline (study schedule) */
  .timeline{position:relative; padding-right:20px;}
  body.ltr .timeline{padding-right:0; padding-left:20px;}
  .timeline::before{content:""; position:absolute; right:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  body.ltr .timeline::before{right:auto; left:6px;}
  .t-item{position:relative; display:flex; gap:14px; align-items:flex-start; padding-bottom:20px;}
  .t-item::before{content:""; position:absolute; right:-1px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--bg);}
  body.ltr .t-item::before{right:auto; left:-1px;}
  .t-time{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:56px; flex-shrink:0; direction:ltr; text-align:left;}
  .t-card{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .t-card .t-info{flex:1;}
  .t-card .name{font-weight:600; font-size:14px;}
  .t-card .room{font-size:12px; color:var(--ink-soft);}
  .t-card .t-del{
    background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px; flex-shrink:0;
  }
  .t-card .t-del:hover{ color:#B0522D; background:#F6E6DB; }
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap;}

  /* Course cards */
  .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .course-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; border-right:5px solid var(--c); cursor:pointer; transition:.15s;
    display:flex; flex-direction:column; gap:10px;
  }
  body.ltr .course-card{border-right:1px solid var(--line); border-left:5px solid var(--c);}
  .course-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,42,56,.08);}
  .course-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .course-card h3{margin:0; font-size:16px; font-weight:700; font-family:'IBM Plex Sans Arabic';}
  .course-card .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); direction:ltr; display:inline-block;}
  .tag{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; background:var(--cbg); color:var(--c);}
  .progress-track{height:6px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--c); border-radius:999px; transition:width .4s ease;}
  .course-card .meta{font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between;}

  /* Standalone course page */
  #coursePage{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:18px;
  }
  .back-btn:hover{ color:var(--ink); }
  .course-hero{
    background:var(--c-bg, var(--gold-soft)); border-radius:var(--radius); padding:22px 22px 20px;
    border-right:5px solid var(--c-page, var(--gold)); margin-bottom:26px;
  }
  body.ltr .course-hero{border-right:1px solid transparent; border-left:5px solid var(--c-page, var(--gold));}
  .course-hero .tag{ background:var(--paper); color:var(--c-page, var(--gold)); }
  .course-hero h2{ margin:8px 0 2px; font-size:26px; }
  .course-hero .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .course-hero .progress-track{ height:8px; }
  .course-hero .progress-fill{ background:var(--c-page, var(--gold)); }
  .cp-section{ margin-bottom:26px; }
  .cp-section h3{ font-size:16px; margin:0 0 12px; }
  .cp-empty{ font-size:13px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:16px; text-align:center; }

  /* Lecture accordion */
  .lecture-card{ 
    background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;
    transition:.2s;
  }
  .lecture-card.open{ border-color:var(--c-page, var(--gold)); }
  .lecture-card.reading-mode .lecture-body{
    max-width:700px; margin:0 auto; font-size:16px; line-height:1.8; padding:20px;
  }
  .lecture-head{ display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; }
  .lecture-check{ width:18px; height:18px; accent-color:var(--c-page, var(--gold)); flex-shrink:0; cursor:pointer; }
  .lecture-title{ flex:1; font-size:14px; font-weight:600; }
  .lecture-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .lecture-dur{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr; }
  .lecture-icons{ font-size:20px; display:flex; gap:4px; }
  .lecture-badge{
    width:42px; height:42px; border-radius:50%; background:var(--c-bg, var(--gold-soft));
    color:var(--c-page, var(--gold)); display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; flex-shrink:0; transition:.2s;
  }
  .lecture-body{ padding:14px 14px 16px; border-top:1px solid var(--line); animation:slideDown .3s ease; }
  @keyframes slideDown{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }

  .files-list{
    display:flex; flex-direction:column; gap:8px; margin-bottom:12px;
  }
  .attach-chip{
    display:flex; align-items:center; gap:12px;
    font-size:13px; background:var(--c-bg, var(--gold-soft));
    color:var(--c-page, var(--gold)); padding:12px 14px; border-radius:10px;
    text-decoration:none; cursor:pointer; border:1px solid transparent;
    transition:.2s; position:relative;
  }
  .attach-chip:hover{ border-color:var(--c-page, var(--gold)); transform:translateX(-2px); }
  body.ltr .attach-chip:hover{ transform:translateX(2px); }
  .attach-chip .file-icon{ font-size:28px; flex-shrink:0; }
  .attach-chip .file-name{ flex:1; font-weight:500; word-break:break-word; }
  .attach-chip .file-del{
    background:rgba(255,255,255,0.9); border:none;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--ink-soft); cursor:pointer; opacity:0; transition:.2s; flex-shrink:0;
  }
  .attach-chip:hover .file-del{ opacity:1; }
  .attach-chip .file-del:hover{ color:#B0522D; background:#fff; }

  /* PDF Viewer */
  .pdf-viewer{
    width:100%; height:600px; border:1px solid var(--line); border-radius:10px;
    margin:10px 0; background:var(--paper);
  }
  .pdf-controls{
    display:flex; gap:10px; align-items:center; margin-bottom:10px;
  }
  .pdf-controls button{
    background:var(--gold); color:#fff; border:none; border-radius:6px;
    padding:6px 12px; font-size:12px; font-weight:600;
  }
  .reading-mode-toggle{
    background:transparent; border:1.5px solid var(--gold); color:var(--gold);
    border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; margin-bottom:10px;
  }
  .reading-mode-toggle:hover{background:var(--gold); color:#fff;}

  /* Upload */
  .upload-row{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 12px; }
  .upload-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1.5px dashed var(--c-page, var(--gold));
    color:var(--c-page, var(--gold)); border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:600;
  }
  .upload-btn:hover{ background:var(--c-bg, var(--gold-soft)); }
  .upload-status{ font-size:11.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5; }
  
  /* Add lecture button & form */
  .add-lecture-btn{
    background:transparent; border:1.5px dashed var(--c-page, var(--gold)); color:var(--c-page, var(--gold));
    border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; width:100%; margin-top:8px;
  }
  .add-lecture-btn:hover{ background:var(--c-bg, var(--gold-soft)); }
  .lecture-form{
    background:var(--c-bg, var(--gold-soft)); border:1px solid var(--c-page, var(--gold)); border-radius:12px;
    padding:14px; margin-bottom:10px; display:flex; flex-direction:column; gap:10px;
  }
  .lecture-form input, .lecture-form textarea{
    border:1px solid var(--c-page, var(--gold)); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--paper); color:var(--ink); width:100%;
  }
  .lecture-form textarea{resize:vertical; min-height:80px;}
  .lecture-form .form-actions{ display:flex; gap:10px; }
  .lecture-form .btn-save{ background:var(--c-page, var(--gold)); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; }
  .lecture-form .btn-cancel{ background:transparent; border:1px solid var(--c-page, var(--gold)); color:var(--c-page, var(--gold)); border-radius:999px; padding:9px 18px; font-size:13px; }

  /* Assignments */
  .assign-list{display:flex; flex-direction:column; gap:8px;}
  .assign{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
  }
  .assign.urgent{border-left:4px solid #e74c3c;}
  body.ltr .assign.urgent{border-left:1px solid var(--line); border-right:4px solid #e74c3c;}
  .assign .info{display:flex; flex-direction:column; gap:2px;}
  .assign .a-title{font-weight:600; font-size:14px;}
  .assign .a-course{font-size:12px; color:var(--ink-soft);}
  .assign .due{font-size:12px; font-weight:600; font-family:'IBM Plex Mono',monospace; direction:ltr;}
  .assign .a-right{ display:flex; align-items:center; gap:10px; }
  .assign .a-delete{
    background:transparent; border:none; color:var(--ink-soft); font-size:16px; line-height:1;
    padding:4px 6px; border-radius:6px;
  }
  .assign .a-delete:hover{ color:#B0522D; background:#F6E6DB; }

  .add-btn{
    background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:600;
  }
  .assign-form, .schedule-form{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px;
    margin-bottom:14px; display:flex; flex-direction:column; gap:10px;
  }
  .assign-form input, .assign-form select, .schedule-form input, .schedule-form select{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--bg); color:var(--ink); width:100%;
  }
  .assign-form label, .schedule-form label{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .assign-form .form-actions, .schedule-form .form-actions{ display:flex; gap:10px; margin-top:4px; }
  .assign-form .btn-save, .schedule-form .btn-save{ background:var(--gold); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; }
  .assign-form .btn-cancel, .schedule-form .btn-cancel{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:9px 18px; font-size:13px; }

  /* Grades */
  .grade-card{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:12px; border-right:4px solid var(--gc, var(--gold));
  }
  body.ltr .grade-card{border-right:1px solid var(--line); border-left:4px solid var(--gc, var(--gold));}
  .grade-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .grade-course-title{ font-size:14px; font-weight:700; }
  .grade-total{ font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--gc, var(--gold)); }
  .grade-rows{ display:flex; flex-direction:column; gap:8px; }
  .grade-row{ display:flex; align-items:center; gap:8px; }
  .grade-label{ font-size:12.5px; color:var(--ink-soft); width:70px; flex-shrink:0; }
  .grade-input{
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px;
    font-family:'IBM Plex Mono',monospace; background:var(--bg); color:var(--ink); width:100%; text-align:center;
  }
  .grade-input.small{ max-width:56px; }
  .grade-slash{ color:var(--ink-soft); font-size:13px; }
  .grade-del{
    background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px; flex-shrink:0;
  }
  .grade-del:hover{ color:#B0522D; background:#F6E6DB; }
  .add-quiz-btn{
    background:transparent; border:1px dashed var(--gc, var(--gold)); color:var(--gc, var(--gold));
    border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; margin-top:8px;
  }

  footer{text-align:center; padding:24px; font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>

<!-- Notification Toast -->
<div class="notification-toast" id="notificationToast">
  <button class="notif-close" onclick="hideNotification()">×</button>
  <div class="notif-title" id="notifTitle"></div>
  <div class="notif-body" id="notifBody"></div>
</div>

<header>
  <div class="brand">
    <div class="seal" id="sealLetter">أ</div>
    <div class="brand-text">
      <h1 id="brandTitle">أُفـق</h1>
      <p id="brandSubtitle">منصة الطالب الجامعي</p>
    </div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <button class="lang-switch" id="langToggle">EN</button>
    <div class="avatar" id="avatarInitials">د ح</div>

// ===== Notification System =====
function showNotification(title, body, duration = 5000){
  const toast = document.getElementById('notificationToast');
  document.getElementById('notifTitle').textContent = title;
  document.getElementById('notifBody').textContent = body;
  toast.classList.add('show');
  setTimeout(() => hideNotification(), duration);
}

function hideNotification(){
  document.getElementById('notificationToast').classList.remove('show');
}

function checkUpcomingAssignments(){
  const today = new Date();
  const threeDaysLater = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
  
  const urgentAssignments = assignments.filter(a => {
    if(a.faculty !== currentFaculty) return false;
    // بسّطنا: أي واجب urgent = true يعتبر قريب
    return a.urgent;
  });
  
  if(urgentAssignments.length > 0){
    const body = S('notifUrgent').replace('{count}', urgentAssignments.length);
    showNotification(S('notifUpcoming'), body);
  }
}

// ===== Export / Import =====
function exportData(){
  const state = buildState();
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ufuq-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showNotification('✅', S('exportSuccess'), 3000);
}

function importData(){
  document.getElementById('importInput').click();
}

document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', importData);
document.getElementById('importInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const imported = JSON.parse(ev.target.result);
      applyState(imported);
      saveState();
      showNotification('✅', S('importSuccess'), 3000);
      location.reload();
    }catch(err){
      alert('❌ خطأ في قراءة الملف');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function buildState(){
  const doneMap = {};
  const filesMap = {};
  const lessonsMap = {};
  const notesMap = {};
  courses.forEach(c=>{
    doneMap[c.id] = c.lessons.map(l=>l.done);
    filesMap[c.id] = c.lessons.map(l=>l.files || []);
    lessonsMap[c.id] = c.lessons.map(l=>({t:l.t, d:l.d}));
    notesMap[c.id] = c.lessons.map(l=>l.notes || '');
  });
  return { 
    assignments, nextAssignmentId, schedule, nextScheduleId, gradesData, 
    doneMap, filesMap, lessonsMap, notesMap, lang, currentFaculty, currentView, darkMode
  };
}

function applyState(state){
  if(!state) return;
  if(Array.isArray(state.assignments)){
    assignments.length = 0;
    state.assignments.forEach(a=>assignments.push(a));
  }
  if(typeof state.nextAssignmentId === 'number') nextAssignmentId = state.nextAssignmentId;
  if(Array.isArray(state.schedule)){
    schedule.length = 0;
    state.schedule.forEach(s=>schedule.push(s));
  }
  if(typeof state.nextScheduleId === 'number') nextScheduleId = state.nextScheduleId;
  if(state.gradesData) Object.assign(gradesData, state.gradesData);
  if(state.lessonsMap){
    courses.forEach(c=>{
      const arr = state.lessonsMap[c.id];
      if(arr && arr.length > 0){
        c.lessons = arr.map(l=>({t:l.t, d:l.d, done:false, files:[], notes:''}));
      }
    });
  }
  if(state.doneMap){
    courses.forEach(c=>{
      const arr = state.doneMap[c.id];
      if(arr) c.lessons.forEach((l,i)=>{ if(arr[i] !== undefined) l.done = arr[i]; });
    });
  }
  if(state.filesMap){
    courses.forEach(c=>{
      const arr = state.filesMap[c.id];
      if(arr){
        c.lessons.forEach((l,i)=>{
          if(arr[i]) l.files = arr[i];
        });
      }
    });
  }
  if(state.notesMap){
    courses.forEach(c=>{
      const arr = state.notesMap[c.id];
      if(arr){
        c.lessons.forEach((l,i)=>{
          if(arr[i] !== undefined) l.notes = arr[i];
        });
      }
    });
  }
  if(state.lang) lang = state.lang;
  if(state.currentFaculty) currentFaculty = state.currentFaculty;
  if(state.currentView) currentView = state.currentView;
  if(state.darkMode !== undefined){
    darkMode = state.darkMode;
    document.body.classList.toggle('dark-mode', darkMode);
    document.getElementById('themeToggle').textContent = darkMode ? '☀️' : '🌙';
  }
}

async function saveState(){
  const state = buildState();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(db){
    try{ await setDoc(stateDocRef(), state); }
    catch(e){}
  }
}

async function loadState(){
  let state = null;
  if(db){
    try{
      const snap = await getDoc(stateDocRef());
      if(snap.exists()) state = snap.data();
    }catch(e){}
  }
  if(!state){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){}
  }
  applyState(state);
}

const gradesData = {};

function getCourseGrades(courseId){
  if(!gradesData[courseId]){
    gradesData[courseId] = {
      quizzes: [{label:(lang==='ar'?'كويز 1':'Quiz 1'), score:'', max:10}],
      midterm: {score:'', max:30},
      final:   {score:'', max:50},
    };
  }
  return gradesData[courseId];
}

function computeTotal(g){
  let scoreSum = 0, maxSum = 0;
  (g.quizzes || []).forEach(q=>{
    const s = parseFloat(q.score), m = parseFloat(q.max);
    if(!isNaN(m) && m > 0) maxSum += m;
    if(!isNaN(s)) scoreSum += s;
  });
  ['midterm','final'].forEach(p=>{
    const s = parseFloat(g[p].score), m = parseFloat(g[p].max);
    if(!isNaN(m) && m > 0) maxSum += m;
    if(!isNaN(s)) scoreSum += s;
  });
  if(maxSum === 0) return null;
  return {scoreSum, maxSum, pct: Math.round((scoreSum/maxSum)*100)};
}

function gradeRowHtml(courseId, part, label, obj, extra=''){
  return `
    <div class="grade-row">
      <span class="grade-label">${label}</span>
      <input type="number" class="grade-input" placeholder="${lang==='ar'?'الدرجة':'Score'}" value="${obj.score}" data-grade="${courseId}|${part}|score" inputmode="decimal">
      <span class="grade-slash">/</span>
      <input type="number" class="grade-input small" placeholder="${lang==='ar'?'من':'Max'}" value="${obj.max}" data-grade="${courseId}|${part}|max" inputmode="decimal">
      ${extra}
    </div>`;
}

function renderGradesList(facCourses){
  const list = facCourses || courses.filter(c=>c.faculty===currentFaculty);
  const wrap = document.getElementById('gradesList');
  if(!wrap) return;
  if(list.length === 0){
    wrap.innerHTML = `<div class="cp-empty">${S('empty_grades')}</div>`;
    return;
  }

  wrap.innerHTML = list.map(course=>{
    const th = THEME[course.subject];
    const g = getCourseGrades(course.id);
    const total = computeTotal(g);
    const quizRows = g.quizzes.map((q,qi)=>gradeRowHtml(
      course.id, `quiz-${qi}`, q.label, q,
      `<button class="grade-del" data-del-quiz="${course.id}|${qi}" title="✕">✕</button>`
    )).join('');
    return `
      <div class="grade-card" style="--gc:${th.c}; --gcbg:${th.bg}">
        <div class="grade-card-head">
          <span class="grade-course-title">${L(course.title)}</span>
          <span class="grade-total" id="total-${course.id}">${total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—'}</span>
        </div>
        <div class="grade-rows" id="quizRows-${course.id}">${quizRows}</div>
        <button class="add-quiz-btn" data-add-quiz="${course.id}">${lang==='ar'?'+ إضافة كويز':'+ Add Quiz'}</button>
        <div class="grade-rows" style="margin-top:10px;">
          ${gradeRowHtml(course.id, 'midterm', lang==='ar'?'ميد تيرم':'Midterm', g.midterm)}
          ${gradeRowHtml(course.id, 'final', lang==='ar'?'فاينال':'Final', g.final)}
        </div>
      </div>`;
  }).join('');

  function updateTotalDisplay(courseId){
    const total = computeTotal(gradesData[courseId]);
    const totalEl = document.getElementById(`total-${courseId}`);
    if(totalEl) totalEl.textContent = total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—';
  }

  wrap.querySelectorAll('[data-grade]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [courseId, part, field] = inp.dataset.grade.split('|');
      if(part.startsWith('quiz-')){
        const qi = +part.split('-')[1];
        gradesData[courseId].quizzes[qi][field] = inp.value;
      }else{
        gradesData[courseId][part][field] = inp.value;
      }
      updateTotalDisplay(courseId);
      saveState();
    });
  });

  wrap.querySelectorAll('[data-add-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const courseId = btn.dataset.addQuiz;
      const n = gradesData[courseId].quizzes.length + 1;
      gradesData[courseId].quizzes.push({label: (lang==='ar'?'كويز ':'Quiz ') + n, score:'', max:10});
      renderGradesList(list);
      saveState();
    });
  });

  wrap.querySelectorAll('[data-del-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [courseId, qi] = btn.dataset.delQuiz.split('|');
      gradesData[courseId].quizzes.splice(+qi, 1);
      if(gradesData[courseId].quizzes.length === 0){
        gradesData[courseId].quizzes.push({label: lang==='ar'?'كويز 1':'Quiz 1', score:'', max:10});
      }
      renderGradesList(list);
      saveState();
    });
  });
}

function getFileIcon(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(['pdf'].includes(ext)) return '📄';
  if(['mp3','wav','m4a','ogg'].includes(ext)) return '🎙️';
  if(['mp4','avi','mov','mkv'].includes(ext)) return '🎬';
  if(['jpg','jpeg','png','gif','svg'].includes(ext)) return '🖼️';
  if(['doc','docx'].includes(ext)) return '📝';
  if(['xls','xlsx'].includes(ext)) return '📊';
  if(['ppt','pptx'].includes(ext)) return '📽️';
  if(['zip','rar','7z'].includes(ext)) return '📦';
  return '📎';
}

  const fileInput = document.getElementById(`fileInput-${li}`);
  const fileBtn = document.getElementById(`fileUploadBtn-${li}`);

      refreshLectureList(course);

async function handleFileUpload(e, course, li){
  const files = Array.from(e.target.files);
  if(files.length === 0) return;
  const statusEl = document.getElementById(`uploadStatus-${li}`);

  for(const file of files){
    if(file.size > MAX_FILE_SIZE){
      statusEl.textContent = S('fileTooBig');
      continue;
    }

    statusEl.textContent = S('uploadingFile');

    try{
      const url = URL.createObjectURL(file);
      if(!course.lessons[li].files) course.lessons[li].files = [];
      course.lessons[li].files.push({name:file.name, url, size:file.size});
      statusEl.textContent = S('uploadedLocal');
    }catch(err){
      console.error('Upload failed:', err);
      statusEl.textContent = '❌ ' + err.message;
    }
  }
  
  refreshLectureList(course);
  saveState();
  e.target.value = '';
}

    list.innerHTML = `<div class="cp-empty">${S('empty_assign')}</div>`;
  }else{
    list.innerHTML = facAssignments.map(a=>{
      const course = courses.find(c=>c.id===a.courseId);
      return `
      <div class="assign ${a.urgent?'urgent':''}">
        <div class="info">
          <span class="a-title">${L(a.title)}</span>
          <span class="a-course">${L(course.title)}</span>
        </div>
        <div class="a-right">
          <span class="due" style="color:${a.urgent?'#e74c3c':'#5B6472'}">${a.due}</span>
          <button class="a-delete" data-del-assign="${a.id}" title="✕">✕</button>
        </div>
      </div>
    `;}).join('');
    list.querySelectorAll('[data-del-assign]').forEach(btn=>{
      btn.addEventListener('click', ()=>deleteAssignment(+btn.dataset.delAssign));
    });
  }
  updateDueStat();
}

function renderAssignmentsPage(){
  const page = document.getElementById('assignmentsPage');
  page.innerHTML = `
    <button class="back-btn" id="assignBack">${S('back')}</button>
    <div class="section-head">
      <h2>${S('tabAssignments')} — ${L(FACULTIES[currentFaculty].short)}</h2>
      <button class="add-btn" id="addAssignBtn">${S('assignBtnFull')}</button>
    </div>
    <div id="assignForm" class="assign-form" style="display:none;"></div>
    <div class="assign-list" id="assignList"></div>
  `;
  page.querySelector('#assignBack').addEventListener('click', ()=>history.back());
  page.querySelector('#addAssignBtn').addEventListener('click', ()=>{
    const formEl = document.getElementById('assignForm');
    if(formEl.style.display === 'flex'){ closeAssignForm(); }
    else{ openAssignForm(); }
  });
  renderAssignmentsList();
}

function deleteAssignment(id){
  const idx = assignments.findIndex(a=>a.id===id);
  if(idx !== -1) assignments.splice(idx, 1);
  renderAssignmentsList();
  checkUpcomingAssignments();
  saveState();
}

function openAssignForm(){
  const facCourses = courses.filter(c=>c.faculty===currentFaculty);
  const formEl = document.getElementById('assignForm');
  formEl.innerHTML = `
    <input type="text" id="newAssignTitle" placeholder="${lang==='ar'?'عنوان الواجب':'Assignment Title'}">
    <select id="newAssignCourse">
      ${facCourses.map(c=>`<option value="${c.id}">${L(c.title)}</option>`).join('')}
    </select>
    <input type="text" id="newAssignDue" placeholder="${lang==='ar'?'تاريخ التسليم (مثلاً: 30 أغسطس)':'Due Date (e.g. Aug 30)'}">
    <label><input type="checkbox" id="newAssignUrgent"> ${lang==='ar'?'عاجل':'Urgent'}</label>
    <div class="form-actions">
      <button class="btn-save" id="saveAssignBtn">${lang==='ar'?'حفظ':'Save'}</button>
      <button class="btn-cancel" id="cancelAssignBtn">${lang==='ar'?'إلغاء':'Cancel'}</button>
    </div>
  `;
  formEl.style.display = 'flex';
  document.getElementById('saveAssignBtn').addEventListener('click', saveNewAssignment);
  document.getElementById('cancelAssignBtn').addEventListener('click', closeAssignForm);
}

function closeAssignForm(){
  const formEl = document.getElementById('assignForm');
  if(!formEl) return;
  formEl.style.display = 'none';
  formEl.innerHTML = '';
}

function saveNewAssignment(){
  const titleInput = document.getElementById('newAssignTitle');
  const courseSelect = document.getElementById('newAssignCourse');
  const dueInput = document.getElementById('newAssignDue');
  const urgentCheck = document.getElementById('newAssignUrgent');

  const titleVal = titleInput.value.trim();
  const courseId = courseSelect.value;
  const dueVal = dueInput.value.trim();
  const urgentVal = urgentCheck.checked;

  if(!titleVal || !dueVal){
    alert(lang==='ar' ? 'اكتب عنوان الواجب وتاريخ التسليم' : 'Enter title and due date');
    return;
  }

  assignments.push({
    id: nextAssignmentId++, 
    title: {ar:titleVal, en:titleVal}, 
    courseId, 
    faculty: currentFaculty, 
    due: dueVal, 
    urgent: urgentVal
  });
  closeAssignForm();
  renderAssignmentsList();
  checkUpcomingAssignments();
  saveState();
}

function openScheduleForm(){
  const facCourses = courses.filter(c=>c.faculty===currentFaculty);
  const formEl = document.getElementById('schedForm');
  
  const today = getTodayName();
  const todayDate = getTodayDate();
  
  formEl.innerHTML = `
    <input type="text" id="newSchedDay" placeholder="${lang==='ar'?'اليوم (افتراضيًا: اليوم)':'Day (default: today)'}" value="${today}">
    <input type="text" id="newSchedDate" placeholder="${lang==='ar'?'التاريخ (افتراضيًا: اليوم)':'Date (default: today)'}" value="${todayDate}">
    <input type="time" id="newSchedTime">
    <select id="newSchedCourse">
      ${facCourses.map(c=>`<option value="${c.id}">${L(c.title)}</option>`).join('')}
    </select>
    <div class="form-actions">
      <button class="btn-save" id="saveSchedBtn">${lang==='ar'?'حفظ':'Save'}</button>
      <button class="btn-cancel" id="cancelSchedBtn">${lang==='ar'?'إلغاء':'Cancel'}</button>
    </div>
  `;
  formEl.style.display = 'flex';
  document.getElementById('saveSchedBtn').addEventListener('click', saveNewSchedule);
  document.getElementById('cancelSchedBtn').addEventListener('click', closeScheduleForm);
}

function closeScheduleForm(){
  const formEl = document.getElementById('schedForm');
  if(!formEl) return;
  formEl.style.display = 'none';
  formEl.innerHTML = '';
}

function saveNewSchedule(){
  const day = document.getElementById('newSchedDay').value.trim() || getTodayName();
  const date = document.getElementById('newSchedDate').value.trim() || getTodayDate();
  const time = document.getElementById('newSchedTime').value.trim();
  const courseId = document.getElementById('newSchedCourse').value;

  if(!time){
    alert(lang==='ar' ? 'اختار الوقت' : 'Select time');
    return;
  }

  schedule.push({
    id: nextScheduleId++,
    day, date, time, courseId,
    faculty: currentFaculty
  });
  closeScheduleForm();
  renderSchedule();
  saveState();
}

document.getElementById('addSchedBtn').addEventListener('click', ()=>{
  const formEl = document.getElementById('schedForm');
  if(formEl.style.display === 'flex') closeScheduleForm();
  else openScheduleForm();
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');

    const targetId = tab.dataset.tab;
    if(targetId === 'assignmentsSection'){
      navigate('assignments');
    }else if(targetId === 'gradesSection'){
      navigate('grades');
    }else{
      navigate('dashboard');
    }
  });
});

function syncActiveTab(view){
  const map = {dashboard:'dashboard', assignments:'assignmentsSection', grades:'gradesSection'};
  const targetTab = map[view];
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', targetTab && t.dataset.tab === targetTab);
  });
}
window.addEventListener('popstate', (e)=>{
  const state = e.state || {view:'dashboard'};
  syncActiveTab(state.view);
});

function applyLanguage(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('ltr', lang==='en');

  document.getElementById('sealLetter').textContent = lang==='ar' ? 'أ' : 'U';
  document.getElementById('brandTitle').textContent = lang==='ar' ? 'أُفـق' : 'Ufuq';
  document.getElementById('brandSubtitle').textContent = S('brandSubtitle');
  document.getElementById('avatarInitials').textContent = lang==='ar' ? 'د ح' : 'DS';
  document.getElementById('langToggle').textContent = lang==='ar' ? 'EN' : 'عربي';

  document.getElementById('statLabel').textContent = S('dueLabel');
  document.getElementById('scheduleTitle').textContent = S('scheduleTitle');
  document.getElementById('coursesTitle').textContent = S('coursesTitle');
  document.getElementById('footerText').textContent = S('footerText');

  const tabLabels = ['tabDashboard','tabAssignments','tabGrades'];
  document.querySelectorAll('.tab-label').forEach((el,i)=>{
    el.textContent = S(tabLabels[i]);
  });

  renderFacultySwitch();
  renderCourses();
  renderSchedule();
  renderAssignmentsList();
  updateDueStat();
  
  if(currentView.view === 'course'){
    renderCoursePageContent(currentView.params.courseId);
  }else if(currentView.view === 'assignments'){
    renderAssignmentsPage();
  }else if(currentView.view === 'grades'){
    renderGradesPage();
  }
}

document.getElementById('langToggle').addEventListener('click', ()=>{
  lang = lang==='ar' ? 'en' : 'ar';
  applyLanguage();
  saveState();
});

async function initApp(){
  await loadState();
  applyLanguage();
  
  if(currentView && currentView.view){
    showView(currentView.view, currentView.params);
    history.replaceState(currentView, '', '#' + currentView.view);
  }else{
    history.replaceState({view:'dashboard', params:{}}, '', '#dashboard');
  }
  
  checkUpcomingAssignments();
}
initApp();
</script>
</body>
</html>
