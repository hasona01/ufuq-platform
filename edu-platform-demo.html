<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أفق — منصة الطالب الجامعي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F6F5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أُفق">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #EFE9DC;
      --bg-course: #E8F4F8;
      --paper: #FFFFFF;
      --ink: #24303A;
      --ink-soft: #64707C;
      --line: #DED4BE;
      --gold: #1F6F5C;
      --gold-soft: #DCEDE7;
      --radius: 14px;
    }
    
    /* Dark Mode */
    body.dark-mode{
      --bg: #1a1d23;
      --bg-course: #1e2834;
      --paper: #252b36;
      --ink: #e8eaed;
      --ink-soft: #9aa0a6;
      --line: #3c4149;
      --gold: #4db6ac;
      --gold-soft: #2d3e3a;
    }
    
    *{box-sizing:border-box;}
    body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s;}
    body.ltr{direction:ltr;}
    body.course-view{background:var(--bg-course);}
    h1,h2,h3,.display{font-family:'Amiri', serif;}
    .mono{font-family:'IBM Plex Mono', monospace; direction:ltr; display:inline-block;}
    button{font-family:inherit; cursor:pointer;}

    /* ===== Header ===== */
    header{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--line);
      position:sticky; top:0; z-index:20;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .brand .seal{
      width:38px; height:38px; border-radius:50%; background:var(--ink);
      color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
      font-family:'Amiri',serif; font-weight:700; font-size:18px; flex-shrink:0;
      border:2px solid var(--gold);
    }
    .brand-text h1{margin:0; font-size:19px; font-weight:700;}
    .brand-text p{margin:0; font-size:11px; color:var(--ink-soft); letter-spacing:.5px;}
    .header-right{display:flex; align-items:center; gap:12px;}
    .theme-toggle, .lang-switch{
      background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:999px;
      padding:7px 14px; font-size:13px; font-weight:700; color:var(--gold);
      transition:.2s;
    }
    .theme-toggle:hover, .lang-switch:hover{background:var(--gold); color:#fff;}
    .avatar{
      width:36px; height:36px; border-radius:50%; background:var(--gold-soft);
      color:var(--gold); display:flex; align-items:center; justify-content:center;
      font-weight:600; border:1px solid var(--gold); font-size:13px;
    }

    /* ===== Notification Toast ===== */
    .notification-toast{
      position:fixed; top:80px; right:20px; background:var(--paper);
      border:1px solid var(--gold); border-left:5px solid var(--gold);
      border-radius:12px; padding:14px 18px; box-shadow:0 4px 20px rgba(0,0,0,0.15);
      z-index:1000; max-width:350px; animation:slideInRight 0.3s ease;
      display:none;
    }
    body.ltr .notification-toast{right:auto; left:20px; border-left:1px solid var(--gold); border-right:5px solid var(--gold);}
    .notification-toast.show{display:block;}
    @keyframes slideInRight{
      from{transform:translateX(400px); opacity:0;}
      to{transform:translateX(0); opacity:1;}
    }
    .notification-toast .notif-title{font-weight:700; font-size:14px; margin-bottom:4px;}
    .notification-toast .notif-body{font-size:13px; color:var(--ink-soft); line-height:1.5;}
    .notification-toast .notif-close{
      position:absolute; top:8px; right:8px; background:transparent; border:none;
      color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px;
    }
    body.ltr .notification-toast .notif-close{right:auto; left:8px;}

    /* ===== Layout ===== */
    .app{max-width:1180px; margin:0 auto; padding:20px 16px 60px; display:grid; grid-template-columns:200px 1fr; gap:22px;}
    @media (max-width:800px){ .app{grid-template-columns:1fr;} }

    /* Binder tab nav */
    nav.binder{display:flex; flex-direction:column; gap:6px;}
    .tab{
      display:flex; align-items:center; gap:10px; padding:12px 14px;
      border-radius:0 999px 999px 0; border:1px solid transparent; border-left:none;
      background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500;
      text-align:right; transition:.15s;
    }
    body.ltr .tab{border-radius:999px 0 0 999px; border-left:1px solid transparent; border-right:none;}
    .tab .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0;}
    .tab.active{background:var(--paper); color:var(--ink); font-weight:700; border-color:var(--line); box-shadow:2px 0 0 var(--gold) inset;}
    body.ltr .tab.active{box-shadow:-2px 0 0 var(--gold) inset;}
    .tab.active .dot{background:var(--gold);}
    .tab:hover{background:var(--paper); color:var(--ink);}
    @media (max-width:800px){
      nav.binder{flex-direction:row; overflow-x:auto; padding-bottom:4px;}
      .tab{white-space:nowrap; border-radius:999px; border-left:1px solid transparent;}
      body.ltr .tab{border-radius:999px; border-right:1px solid transparent;}
    }

    main{min-width:0;}

    /* Stats row */
    .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
    @media (max-width:640px){ .stats{grid-template-columns:1fr;} }
    .stat-card{
      background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
      padding:16px 18px;
    }
    .stat-card .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
    .stat-card .value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right;}
    body.ltr .stat-card .value{text-align:left;}

    section{margin-bottom:30px;}
    .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
    .section-head h2{font-size:20px; margin:0;}
    .section-head span{font-size:12px; color:var(--ink-soft);}
    .section-head .add-btn, .export-btn{
      background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
      font-size:12.5px; font-weight:600;
    }
    .export-btn{background:transparent; border:1.5px solid var(--gold); color:var(--gold);}
    .export-btn:hover{background:var(--gold); color:#fff;}

    /* Faculty switcher */
    .faculty-switch{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
    .fac-btn{
      background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
      padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    }
    .fac-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

    /* Timeline (study schedule) */
    .timeline{position:relative; padding-right:20px;}
    body.ltr .timeline{padding-right:0; padding-left:20px;}
    .timeline::before{content:""; position:absolute; right:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
    body.ltr .timeline::before{right:auto; left:6px;}
    .t-item{position:relative; display:flex; gap:14px; align-items:flex-start; padding-bottom:20px;}
    .t-item::before{content:""; position:absolute; right:-1px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--bg);}
    body.ltr .t-item::before{right:auto; left:-1px;}
    .t-time{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:90px; flex-shrink:0; direction:ltr; text-align:left;}
    .t-card{
      flex:1; background:var(--paper); border:1px solid var(--line); border-radius:10px;
      padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .t-card .t-info{flex:1;}
    .t-card .name{font-weight:600; font-size:14px;}
    .t-card .room{font-size:12px; color:var(--ink-soft);}
    .t-card .t-del{
      background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:4px 6px; border-radius:6px; flex-shrink:0;
    }
    .t-card .t-del:hover{ color:#B0522D; background:#F6E6DB; }

    /* Course cards */
    .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
    .course-card{
      background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
      padding:16px; border-right:5px solid var(--c); cursor:pointer; transition:.15s;
      display:flex; flex-direction:column; gap:10px;
    }
    body.ltr .course-card{border-right:1px solid var(--line); border-left:5px solid var(--c);}
    .course-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,42,56,.08);}
    .course-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
    .course-card h3{margin:0; font-size:16px; font-weight:700; font-family:'IBM Plex Sans Arabic';}
    .course-card .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); direction:ltr; display:inline-block;}
    .progress-track{height:6px; background:var(--line); border-radius:999px; overflow:hidden;}
    .progress-fill{height:100%; background:var(--c); border-radius:999px; transition:width .4s ease;}
    .course-card .meta{font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between;}

    /* Standalone course page */
    #coursePage{ animation:fadeIn .3s ease; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
    .back-btn{
      display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
      border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:18px;
    }
    .back-btn:hover{ color:var(--ink); }
    .course-hero{
      background:var(--c-bg, var(--gold-soft)); border-radius:var(--radius); padding:22px 22px 20px;
      border-right:5px solid var(--c-page, var(--gold)); margin-bottom:26px;
    }
    body.ltr .course-hero{border-right:1px solid transparent; border-left:5px solid var(--c-page, var(--gold));}
    .course-hero .tag{ background:var(--paper); color:var(--c-page, var(--gold)); padding:3px 8px; border-radius:6px; font-weight:bold; }
    .course-hero h2{ margin:8px 0 2px; font-size:26px; }
    .course-hero .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
    .course-hero .progress-track{ height:8px; }
    .course-hero .progress-fill{ background:var(--c-page, var(--gold)); }
    .cp-section{ margin-bottom:26px; }
    .cp-section h3{ font-size:16px; margin:0 0 12px; }
    .cp-empty{ font-size:13px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:16px; text-align:center; }

    /* Lecture accordion */
    .lecture-card{ 
      background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;
      transition:.2s;
    }
    .lecture-head{ display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; }
    .lecture-check{ width:18px; height:18px; accent-color:var(--c-page, var(--gold)); flex-shrink:0; cursor:pointer; }
    .lecture-title{ flex:1; font-size:14px; font-weight:600; }
    .lecture-title.done{ text-decoration:line-through; color:var(--ink-soft); }
    .lecture-dur{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr; }

    /* Assignments */
    .assign-list{display:flex; flex-direction:column; gap:8px;}
    .assign{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
    }
    .assign.urgent{border-left:4px solid #e74c3c;}
    body.ltr .assign.urgent{border-left:1px solid var(--line); border-right:4px solid #e74c3c;}
    .assign .a-title{font-weight:600; font-size:14px;}
    .assign .due{font-size:12px; font-weight:600; font-family:'IBM Plex Mono',monospace; direction:ltr;}

    /* Exams */
    .exam-card{
      background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;
      border-right:4px solid var(--ex, var(--gold));
    }
    body.ltr .exam-card{border-right:1px solid var(--line); border-left:4px solid var(--ex, var(--gold));}
    .exam-card .info{display:flex; flex-direction:column; gap:3px;}
    .exam-card .e-course{font-weight:600; font-size:14px;}
    .exam-card .e-meta{font-size:11.5px; color:var(--ink-soft); display:flex; gap:8px; align-items:center;}
    .exam-type-badge{font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:700; background:var(--exbg, var(--gold-soft)); color:var(--ex, var(--gold));}
    .exam-card .e-date{font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--ex, var(--gold));}
    .exam-card .e-right{display:flex; align-items:center; gap:10px;}
    .exam-card .e-delete{background:transparent; border:none; color:var(--ink-soft); font-size:16px; padding:4px 6px; border-radius:6px;}
    .exam-card .e-delete:hover{ color:#B0522D; background:#F6E6DB; }

    footer{text-align:center; padding:24px; font-size:12px; color:var(--ink-soft);}
  </style>
</head>
<body>

  <!-- Notification Toast -->
  <div class="notification-toast" id="notificationToast">
    <button class="notif-close" onclick="hideNotification()">×</button>
    <div class="notif-title" id="notifTitle"></div>
    <div class="notif-body" id="notifBody"></div>
  </div>

  <header>
    <div class="brand">
      <div class="seal" id="sealLetter">أ</div>

      </div>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle">🌙</button>
      <button class="lang-switch" id="langToggle">EN</button>
      <div class="avatar" id="avatarInitials">د ح</div>

  </header>

  <div class="app">
    <nav class="binder">
      <button class="tab active" data-tab="dashboard"><span class="dot"></span><span class="tab-label">لوحة التحكم</span></button>
      <button class="tab" data-tab="assignmentsSection"><span class="dot"></span><span class="tab-label">الواجبات</span></button>
      <button class="tab" data-tab="gradesSection"><span class="dot"></span><span class="tab-label">الدرجات</span></button>
    </nav>

    <main>
     <div id="dashboardView">
      <div class="faculty-switch" id="facultySwitch"></div>

      <div class="stats">
        <div class="stat-card">
          <div class="label" id="statLabel">واجبات مستحقة</div>
          <div class="value" id="dueStat">—</div>
        </div>
      </div>

      <section id="scheduleSection">
        <div class="section-head">
          <h2 id="scheduleTitle">جدول المذاكرة</h2>
          <button class="add-btn" id="addSchedBtn">+ إضافة</button>
        </div>
        <div id="schedForm" class="schedule-form" style="display:none;"></div>
        <div class="timeline" id="schedTimeline"></div>
      </section>

      <section id="examsSection">
        <div class="section-head">
          <h2 id="examsTitle">جدول الامتحانات</h2>
          <button class="add-btn" id="addExamBtn">+ إضافة</button>
        </div>
        <div id="examForm" class="schedule-form" style="display:none;"></div>
        <div id="examsList"></div>
      </section>

      <section id="coursesSection">
        <div class="section-head">
          <h2 id="coursesTitle">موادّي هذا الفصل</h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="export-btn" id="exportBtn">📥 تصدير</button>
            <button class="export-btn" id="importBtn">📤 استيراد</button>
            <input type="file" id="importInput" accept=".json" style="display:none">
            <span id="courseCount">0 مواد</span>
          </div>
        </div>
        <div class="courses" id="courseGrid"></div>
      </section>
     </div>

     <div id="coursePage" style="display:none;"></div>
     <div id="assignmentsPage" style="display:none;"></div>
     <div id="gradesPage" style="display:none;"></div>
    </main>
  </div>

  <footer id="footerText">منصة أُفق</footer>

  <script type="module">

      },
      {id:'nurs_pharm', faculty:'nursing', subject:'pharm', code:'NURS 220', title:{ar:'علم الأدوية', en:'Pharmacology'}, lessons:[
          {t:{ar:'مبادئ علم الأدوية', en:'Principles of Pharmacology'}, d:'20 د', done:true, files:[], notes:''},
          {t:{ar:'حساب الجرعات الدوائية', en:'Drug Dosage Calculation'}, d:'25 د', done:true, files:[], notes:''},
        ]
      },
      {id:'nurs_micro', faculty:'nursing', subject:'micro', code:'NURS 215', title:{ar:'الميكروبيولوجي', en:'Microbiology'}, lessons:[
          {t:{ar:'مقدمة في علم الميكروبات', en:'Introduction to Microbiology'}, d:'20 د', done:true, files:[], notes:''},
        ]
      },
      {id:'nurs_nutr', faculty:'nursing', subject:'nutr', code:'NURS 230', title:{ar:'التغذية', en:'Nutrition'}, lessons:[
          {t:{ar:'أساسيات التغذية السليمة', en:'Fundamentals of Nutrition'}, d:'18 د', done:true, files:[], notes:''},
        ]
      },
      {id:'nurs_intmed', faculty:'nursing', subject:'intmed', code:'NURS 235', title:{ar:'الباطنة', en:'Internal Medicine'}, lessons:[
          {t:{ar:'أمراض الجهاز الهضمي', en:'Gastrointestinal Diseases'}, d:'25 د', done:false, files:[], notes:''},
        ]
      },
      {id:'nurs_comm', faculty:'nursing', subject:'comm', code:'NURS 240', title:{ar:'التواصل', en:'Communication'}, lessons:[
          {t:{ar:'مهارات التواصل العلاجي', en:'Therapeutic Communication Skills'}, d:'20 د', done:true, files:[], notes:''},
        ]
      },
      {id:'nurs_eng2', faculty:'nursing', subject:'eng2', code:'ENG 202', title:{ar:'اللغة الإنجليزية 2', en:'English 2'}, lessons:[
          {t:{ar:'قواعد اللغة الأساسية', en:'Basic Grammar'}, d:'18 د', done:true, files:[], notes:''},
        ]
      },
      {id:'cs_cg', faculty:'cs', subject:'cg', code:'CS 240', title:{ar:'الرسم بالحاسب', en:'Computer Graphics'}, lessons:[
          {t:{ar:'مقدمة عن الرسم بالحاسب', en:'Introduction to Computer Graphics'}, d:'20 د', done:true, files:[], notes:''},
          {t:{ar:'خوارزميات رسم الخطوط', en:'Line Drawing Algorithms'}, d:'24 د', done:false, files:[], notes:''},
        ]
      },
      {id:'cs_net', faculty:'cs', subject:'net', code:'CS 250', title:{ar:'شبكات الحاسب', en:'Computer Networks'}, lessons:[
          {t:{ar:'نموذج OSI', en:'OSI Model'}, d:'24 د', done:true, files:[], notes:''},
        ]
      },
      {id:'cs_field', faculty:'cs', subject:'field', code:'CS 400', title:{ar:'التدريب الميداني', en:'Field Training'}, lessons:[
          {t:{ar:'توجيه واختيار جهة التدريب', en:'Training Site Selection'}, d:'15 د', done:true, files:[], notes:''},
        ]
      },
      {id:'cs_os', faculty:'cs', subject:'os', code:'CS 260', title:{ar:'نظم التشغيل', en:'Operating Systems'}, lessons:[
          {t:{ar:'مقدمة عن نظم التشغيل', en:'Introduction to Operating Systems'}, d:'20 د', done:true, files:[], notes:''},
        ]
      },
      {id:'cs_se', faculty:'cs', subject:'se', code:'CS 310', title:{ar:'هندسة البرمجيات', en:'Software Engineering'}, lessons:[
          {t:{ar:'دورة حياة تطوير البرمجيات', en:'Software Development Life Cycle'}, d:'25 د', done:true, files:[], notes:''},
          {t:{ar:'تحليل المتطلبات', en:'Requirements Analysis'}, d:'30 د', done:false, files:[], notes:''}
        ]
      }
    ];

    let currentFaculty = 'nursing';
    let lang = 'ar';
    let schedule = [
      {id:'s1', days:['Sun', 'Tue'], time:'09:00 - 11:00', name:{ar:'تمريض البالغين - نظري', en:'Adult Nursing - Theory'}, room:{ar:'قاعة 1', en:'Hall 1'}, subject:'adultTh'},
      {id:'s2', days:['Mon', 'Wed'], time:'11:30 - 01:30', name:{ar:'علم الأدوية', en:'Pharmacology'}, room:{ar:'معمل 3', en:'Lab 3'}, subject:'pharm'}
    ];
    let assignments = [
      {id:'a1', title:{ar:'تقرير تقييم المريض', en:'Patient Assessment Report'}, course:'adultTh', due:'2026-09-01', urgent:true},
      {id:'a2', title:{ar:'حساب جرعة الدواء', en:'Dosage Calculation Task'}, course:'pharm', due:'2026-09-05', urgent:false}
    ];
    let exams = [
      {id:'e1', course:{ar:'علم الأدوية', en:'Pharmacology'}, type:{ar:'ميدترم', en:'Midterm'}, date:'2026-09-15', subject:'pharm'},
      {id:'e2', course:{ar:'تمريض البالغين', en:'Adult Nursing'}, type:{ar:'نهائي', en:'Final'}, date:'2026-10-10', subject:'adultTh'}
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initUI();
      setupFirebaseSync();
    });

    function initUI() {
      renderFacultySwitch();
      renderSchedule();
      renderExams();
      renderCourses();
      renderStats();
      setupEventListeners();
    }

    function renderFacultySwitch() {
      const container = document.getElementById('facultySwitch');
      if (!container) return;
      container.innerHTML = Object.keys(FACULTIES).map(key => `
        <button class="fac-btn ${currentFaculty === key ? 'active' : ''}" data-fac="${key}">
          ${FACULTIES[key].label[lang]}
        </button>
      `).join('');

      container.querySelectorAll('.fac-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentFaculty = e.target.dataset.fac;
          renderFacultySwitch();
          renderCourses();
        });
      });
    }

    function renderStats() {
      const dueCount = assignments.filter(a => a.urgent).length;
      document.getElementById('dueStat').innerText = dueCount;
    }

    function renderSchedule() {
      const container = document.getElementById('schedTimeline');
      if (!container) return;
      
      if (schedule.length === 0) {
        container.innerHTML = `<div class="cp-empty">${lang === 'ar' ? 'لا يوجد جدول حالياً' : 'No schedule available'}</div>`;
        return;
      }

      container.innerHTML = schedule.map(item => {
        const theme = THEME[item.subject] || THEME.adultTh;
        return `
          <div class="t-item">
            <div class="t-time">${item.time}</div>
            <div class="t-card" style="border-right: 4px solid ${theme.c}">
              <div class="t-info">
                <div class="name">${item.name[lang] || item.name.ar}</div>
                <div class="room">${item.room[lang] || item.room.ar} — ${item.days.join(', ')}</div>
              </div>
              <button class="t-del" onclick="deleteScheduleItem('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderExams() {
      const container = document.getElementById('examsList');
      if (!container) return;

      container.innerHTML = exams.map(exam => {
        const theme = THEME[exam.subject] || THEME.adultTh;
        return `
          <div class="exam-card" style="--ex: ${theme.c}; --exbg: ${theme.bg}">
            <div class="info">
              <div class="e-course">${exam.course[lang] || exam.course.ar}</div>
              <div class="e-meta">
                <span class="exam-type-badge">${exam.type[lang] || exam.type.ar}</span>
              </div>
            </div>
            <div class="e-right">
              <div class="e-date">${exam.date}</div>
              <button class="e-delete" onclick="deleteExam('${exam.id}')">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCourses() {
      const grid = document.getElementById('courseGrid');
      if (!grid) return;

      const filtered = courses.filter(c => c.faculty === currentFaculty);
      document.getElementById('courseCount').innerText = `${filtered.length} ${lang === 'ar' ? 'مواد' : 'Courses'}`;

      grid.innerHTML = filtered.map(course => {
        const theme = THEME[course.subject] || {c: '#1F6F5C', bg: '#DCEDE7'};
        const completed = course.lessons.filter(l => l.done).length;
        const progress = course.lessons.length ? Math.round((completed / course.lessons.length) * 100) : 0;

        return `
          <div class="course-card" style="--c: ${theme.c}; --cbg: ${theme.bg}" onclick="openCoursePage('${course.id}')">
            <div class="top">
              <h3>${course.title[lang] || course.title.ar}</h3>
              <span class="code">${course.code}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${progress}%"></div>
            </div>
            <div class="meta">
              <span>${completed}/${course.lessons.length} ${lang === 'ar' ? 'محاضرات' : 'Lessons'}</span>
              <span>${progress}%</span>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openCoursePage = function(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      const mainDash = document.getElementById('dashboardView');
      const coursePage = document.getElementById('coursePage');
      const theme = THEME[course.subject] || {c: '#1F6F5C', bg: '#DCEDE7'};

      mainDash.style.display = 'none';
      coursePage.style.display = 'block';

      const completed = course.lessons.filter(l => l.done).length;
      const progress = course.lessons.length ? Math.round((completed / course.lessons.length) * 100) : 0;

      coursePage.innerHTML = `
        <button class="back-btn" onclick="closeCoursePage()">← ${lang === 'ar' ? 'العودة للرئيسية' : 'Back to Dashboard'}</button>
        <div class="course-hero" style="--c-page: ${theme.c}; --c-bg: ${theme.bg}">
          <span class="tag">${course.code}</span>
          <h2>${course.title[lang] || course.title.ar}</h2>
          <div class="sub">${FACULTIES[course.faculty].label[lang]}</div>
          <div class="progress-track"><div class="progress-fill" style="width: ${progress}%"></div></div>
        </div>

        <div class="cp-section">
          <h3>${lang === 'ar' ? 'المحاضرات والدروس' : 'Lectures & Lessons'}</h3>
          <div id="lessonsList">
            ${course.lessons.map((l, i) => `
              <div class="lecture-card">
                <div class="lecture-head">
                  <input type="checkbox" class="lecture-check" ${l.done ? 'checked' : ''} onchange="toggleLesson('${course.id}', ${i})">
                  <span class="lecture-title ${l.done ? 'done' : ''}">${l.t[lang] || l.t.ar}</span>
                  <span class="lecture-dur">${l.d}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    window.closeCoursePage = function() {
      document.getElementById('coursePage').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      renderCourses();
    };

    window.toggleLesson = function(courseId, index) {
      const course = courses.find(c => c.id === courseId);
      if (course && course.lessons[index]) {
        course.lessons[index].done = !course.lessons[index].done;
        saveStateToFirebase();
      }
    };

    window.deleteScheduleItem = function(id) {
      schedule = schedule.filter(s => s.id !== id);
      renderSchedule();
      saveStateToFirebase();
    };

    window.deleteExam = function(id) {
      exams = exams.filter(e => e.id !== id);
      renderExams();
      saveStateToFirebase();
    };

    function setupEventListeners() {
      const themeBtn = document.getElementById('themeToggle');
      themeBtn?.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        themeBtn.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
      });

      const langBtn = document.getElementById('langToggle');
      langBtn?.addEventListener('click', () => {
        lang = lang === 'ar' ? 'en' : 'ar';
        document.body.classList.toggle('ltr', lang === 'en');
        langBtn.innerText = lang === 'ar' ? 'EN' : 'عربي';
        initUI();
      });
    }

    function setupFirebaseSync() {
      if (!db) return;
      onSnapshot(stateDocRef(), (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.schedule) schedule = data.schedule;
          if (data.assignments) assignments = data.assignments;
          if (data.exams) exams = data.exams;
          initUI();
        }
      });
    }

    async function saveStateToFirebase() {
      if (!db) return;
      try {
        await setDoc(stateDocRef(), { schedule, assignments, exams }, { merge: true });
      } catch (err) {
        console.error('Save failed:', err);
      }
    }
  </script>
</body>
          </html>
