<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسونه — منصة الطالب الجامعي</title>

<!-- PWA: يخلي المنصة قابلة للإضافة للشاشة الرئيسية -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6F5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أُفق">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EFE9DC;
    --paper: #FFFFFF;
    --ink: #24303A;
    --ink-soft: #64707C;
    --line: #DED4BE;
    --gold: #1F6F5C;
    --gold-soft: #DCEDE7;
    --cs: #3B5BA5;
    --cs-bg: #E5EBF6;
    --math: #C1542D;
    --math-bg: #F6E6DB;
    --lit: #8B4F86;
    --lit-bg: #F3E4F1;
    --phys: #2E8B57;
    --phys-bg: #E1F1E7;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Amiri', serif;}
  .mono{font-family:'IBM Plex Mono', monospace; direction:ltr; display:inline-block;}
  button{font-family:inherit; cursor:pointer;}

  /* ===== Header ===== */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .seal{
    width:38px; height:38px; border-radius:50%; background:var(--ink);
    color:var(--gold-soft); display:flex; align-items:center; justify-content:center;
    font-family:'Amiri',serif; font-weight:700; font-size:18px; flex-shrink:0;
    border:2px solid var(--gold);
  }
  .brand-text h1{margin:0; font-size:19px; font-weight:700;}
  .brand-text p{margin:0; font-size:11px; color:var(--ink-soft); letter-spacing:.5px;}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--gold-soft);
    color:var(--gold); display:flex; align-items:center; justify-content:center;
    font-weight:600; border:1px solid var(--gold);
  }

  /* ===== Layout ===== */
  .app{max-width:1180px; margin:0 auto; padding:20px 16px 60px; display:grid; grid-template-columns:200px 1fr; gap:22px;}
  @media (max-width:800px){ .app{grid-template-columns:1fr;} }

  /* Binder tab nav */
  nav.binder{display:flex; flex-direction:column; gap:6px;}
  .tab{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    border-radius:0 999px 999px 0; border:1px solid transparent; border-left:none;
    background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500;
    text-align:right; transition:.15s;
  }
  .tab .dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0;}
  .tab.active{background:var(--paper); color:var(--ink); font-weight:700; border-color:var(--line); box-shadow:2px 0 0 var(--gold) inset;}
  .tab.active .dot{background:var(--gold);}
  .tab:hover{background:var(--paper); color:var(--ink);}
  @media (max-width:800px){
    nav.binder{flex-direction:row; overflow-x:auto; padding-bottom:4px;}
    .tab{white-space:nowrap; border-radius:999px; border-left:1px solid transparent;}
  }

  main{min-width:0;}

  /* Stats row */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:640px){ .stats{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stat-card .value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; text-align:right;}
  .stat-card .value small{font-size:14px; font-weight:400; color:var(--ink-soft);}

  section{margin-bottom:30px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .section-head h2{font-size:20px; margin:0;}
  .section-head span{font-size:12px; color:var(--ink-soft);}

  /* Faculty switcher */
  .faculty-switch{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .fac-btn{
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .fac-btn.active{ background:var(--gold); border-color:var(--gold); color:#fff; }

  /* Timeline (today's schedule) */
  .timeline{position:relative; padding-right:20px;}
  .timeline::before{content:""; position:absolute; right:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .t-item{position:relative; display:flex; gap:14px; align-items:flex-start; padding-bottom:20px;}
  .t-item::before{content:""; position:absolute; right:-1px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--bg);}
  .t-time{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:56px; flex-shrink:0; direction:ltr; text-align:left;}
  .t-card{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .t-card .name{font-weight:600; font-size:14px;}
  .t-card .room{font-size:12px; color:var(--ink-soft);}
  .badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap;}

  /* Course cards */
  .courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .course-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; border-right:5px solid var(--c); cursor:pointer; transition:.15s;
    display:flex; flex-direction:column; gap:10px;
  }
  .course-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,42,56,.08);}
  .course-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .course-card h3{margin:0; font-size:16px; font-weight:700; font-family:'IBM Plex Sans Arabic';}
  .course-card .code{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); direction:ltr; display:inline-block;}
  .tag{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; background:var(--cbg); color:var(--c);}
  .progress-track{height:6px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--c); border-radius:999px; transition:width .4s ease;}
  .course-card .meta{font-size:12px; color:var(--ink-soft); display:flex; justify-content:space-between;}

  /* Standalone course page */
  #coursePage{ animation:fadeIn .3s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:18px;
  }
  .back-btn:hover{ color:var(--ink); }
  .course-hero{
    background:var(--c-bg, var(--gold-soft)); border-radius:var(--radius); padding:22px 22px 20px;
    border-right:5px solid var(--c-page, var(--gold)); margin-bottom:26px;
  }
  .course-hero .tag{ background:var(--paper); color:var(--c-page, var(--gold)); }
  .course-hero h2{ margin:8px 0 2px; font-size:26px; }
  .course-hero .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; }
  .course-hero .progress-track{ height:8px; }
  .course-hero .progress-fill{ background:var(--c-page, var(--gold)); }
  .cp-section{ margin-bottom:26px; }
  .cp-section h3{ font-size:16px; margin:0 0 12px; }
  .lesson{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:8px;
  }
  .lesson input{width:18px; height:18px; accent-color:var(--c-page, var(--gold)); flex-shrink:0;}
  .lesson .l-name{flex:1; font-size:14px; font-weight:500;}
  .lesson.done .l-name{text-decoration:line-through; color:var(--ink-soft);}
  .lesson .l-dur{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr;}
  .cp-empty{ font-size:13px; color:var(--ink-soft); background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:16px; text-align:center; }

  /* Lecture list rows (each row navigates to its own page) */
  .lecture-card{
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;
    background:var(--paper); border:1px solid var(--line); border-radius:12px; margin-bottom:10px;
  }
  .lecture-card:hover{ border-color:var(--c-page, var(--gold)); }
  .lecture-check{ width:18px; height:18px; accent-color:var(--c-page, var(--gold)); flex-shrink:0; }
  .lecture-title{ flex:1; font-size:14px; font-weight:600; }
  .lecture-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .lecture-dur{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; direction:ltr; }
  .lecture-arrow{ font-size:16px; color:var(--c-page, var(--gold)); font-weight:700; }
  .lecture-icons{ font-size:12px; color:var(--ink-soft); display:flex; gap:4px; }
  .attach-chip{ display:inline-block; font-size:12px; background:var(--c-bg, var(--gold-soft)); color:var(--c-page, var(--gold)); padding:6px 12px; border-radius:999px; margin-bottom:8px; }
  .upload-status{ font-size:12px; color:var(--ink-soft); margin:2px 0 8px; }

  /* Standalone lecture page */
  #lecturePage{ animation:fadeIn .3s ease; }
  .lecture-hero{
    background:var(--c-bg, var(--gold-soft)); border-radius:var(--radius); padding:20px 22px;
    border-right:5px solid var(--c-page, var(--gold)); margin-bottom:24px;
    display:flex; align-items:center; gap:14px;
  }
  .lecture-hero h2{ margin:0 0 2px; font-size:22px; }
  .lecture-hero .sub{ font-size:12px; color:var(--ink-soft); }

  /* Upload */
  .upload-row{ display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 8px; }
  .upload-btn{
    display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1.5px dashed var(--c-page, var(--gold));
    color:var(--c-page, var(--gold)); border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:600;
  }
  .upload-btn:hover{ background:var(--c-bg, var(--gold-soft)); }

  /* Quiz */
  .quiz-area{ margin-top:6px; }
  .quiz-btn{
    background:var(--c-page, var(--gold)); color:#fff; border:none; border-radius:8px; padding:9px 14px;
    font-size:12.5px; font-weight:600;
  }
  .quiz-btn:disabled{ opacity:.45; }
  .quiz-status{ font-size:12px; color:var(--ink-soft); margin-top:8px; }
  .quiz-hint{
    background:var(--c-bg, var(--gold-soft)); border:1px solid var(--c-page, var(--gold));
    border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.8; color:var(--ink);
  }
  .quiz-hint em{ color:var(--c-page, var(--gold)); font-style:normal; font-weight:600; }
  .quiz-block{ margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
  .quiz-h{ font-size:13px; color:var(--c-page, var(--gold)); margin:18px 0 10px; }
  .quiz-h:first-child{ margin-top:0; }
  .quiz-q{ margin-bottom:12px; }
  .quiz-q .q-text{ font-size:13.5px; font-weight:600; margin-bottom:7px; }
  .quiz-q .q-opt{
    display:block; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px;
    font-size:13px; margin-bottom:6px; cursor:pointer;
  }
  .quiz-q .q-opt input{ margin-left:8px; accent-color:var(--c-page, var(--gold)); }
  .quiz-q .q-opt.correct{ border-color:#2E8B57; background:#E1F1E7; }
  .quiz-q .q-opt.wrong{ border-color:#C1542D; background:#F6E6DB; }
  .quiz-submit{
    background:var(--c-page, var(--gold)); color:#fff; border:none; border-radius:999px; padding:10px 22px;
    font-size:13px; font-weight:700; margin-top:4px;
  }
  .quiz-score{ font-size:15px; font-weight:700; margin-top:12px; }

  .essay-box{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px;
    font-family:inherit; resize:vertical; background:var(--bg); margin-bottom:8px;
  }
  .reveal-btn{
    background:transparent; border:1px solid var(--c-page, var(--gold)); color:var(--c-page, var(--gold));
    border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600;
  }
  .reveal-box{
    margin-top:10px; background:var(--c-bg, var(--gold-soft)); border-radius:8px; padding:10px 14px;
    font-size:13px; line-height:1.7; list-style-position:inside;
  }

  .terms-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .term-card{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .term-name{ font-weight:700; font-size:14px; margin-bottom:8px; }

  /* Assignments */
  .assign-list{display:flex; flex-direction:column; gap:8px;}
  .assign{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 16px;
  }
  .assign .info{display:flex; flex-direction:column; gap:2px;}
  .assign .a-title{font-weight:600; font-size:14px;}
  .assign .a-course{font-size:12px; color:var(--ink-soft);}
  .assign .due{font-size:12px; font-weight:600; font-family:'IBM Plex Mono',monospace; direction:ltr;}
  .assign .a-right{ display:flex; align-items:center; gap:10px; }
  .assign .a-delete{
    background:transparent; border:none; color:var(--ink-soft); font-size:16px; line-height:1;
    padding:4px 6px; border-radius:6px;
  }
  .assign .a-delete:hover{ color:#B0522D; background:#F6E6DB; }

  .add-btn{
    background:var(--gold); color:#fff; border:none; border-radius:999px; padding:7px 16px;
    font-size:12.5px; font-weight:600;
  }
  .assign-form{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px;
    margin-bottom:14px; display:flex; flex-direction:column; gap:10px;
  }
  .assign-form input, .assign-form select{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--bg); color:var(--ink); width:100%;
  }
  .assign-form label{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .assign-form .form-actions{ display:flex; gap:10px; margin-top:4px; }
  .assign-form .btn-save{ background:var(--gold); color:#fff; border:none; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; }
  .assign-form .btn-cancel{ background:transparent; border:1px solid var(--line); color:var(--ink-soft); border-radius:999px; padding:9px 18px; font-size:13px; }

  .grade-card{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    margin-bottom:12px; border-right:4px solid var(--gc, var(--gold));
  }
  .grade-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .grade-course-title{ font-size:14px; font-weight:700; }
  .grade-total{ font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--gc, var(--gold)); }
  .grade-rows{ display:flex; flex-direction:column; gap:8px; }
  .grade-row{ display:flex; align-items:center; gap:8px; }
  .grade-label{ font-size:12.5px; color:var(--ink-soft); width:70px; flex-shrink:0; }
  .grade-input{
    border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px;
    font-family:'IBM Plex Mono',monospace; background:var(--bg); color:var(--ink); width:100%; text-align:center;
  }
  .grade-input.small{ max-width:56px; }
  .grade-slash{ color:var(--ink-soft); font-size:13px; }

  footer{text-align:center; padding:24px; font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="seal">أ</div>
    <div class="brand-text">
      <h1>أُفـق</h1>
      <p>كليتا التمريض والحاسبات والمعلومات</p>
    </div>
  </div>
  <div class="avatar">س ع</div>
</header>

<div class="app">
  <nav class="binder">
    <button class="tab active" data-tab="dashboard"><span class="dot"></span>لوحة التحكم</button>
    <button class="tab" data-tab="coursesSection"><span class="dot"></span>موادّي</button>
    <button class="tab" data-tab="assignmentsSection"><span class="dot"></span>الواجبات</button>
    <button class="tab" data-tab="gradesSection"><span class="dot"></span>الدرجات</button>
  </nav>

  <main>
   <div id="dashboardView">
    <div class="faculty-switch" id="facultySwitch"></div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">واجبات مستحقة هذا الأسبوع</div>
        <div class="value" id="dueStat">—</div>
      </div>
    </div>

    <section id="scheduleSection">
      <div class="section-head">
        <h2>جدول اليوم — الأربعاء</h2>
        <span>19 أغسطس</span>
      </div>
      <div class="timeline" id="timelineWrap"></div>
    </section>

    <section id="coursesSection">
      <div class="section-head">
        <h2>موادّي هذا الفصل</h2>
        <span id="courseCount">4 مواد</span>
      </div>
      <div class="courses" id="courseGrid"></div>
    </section>

    <section id="assignmentsSection">
      <div class="section-head">
        <h2>واجبات قادمة</h2>
        <button class="add-btn" id="addAssignBtn">+ إضافة واجب</button>
      </div>
      <div id="assignForm" class="assign-form" style="display:none;"></div>
      <div class="assign-list" id="assignList"></div>
    </section>

    <section id="gradesSection">
      <div class="section-head">
        <h2>الدرجات</h2>
        <span>كويزات · ميد تيرم · فاينال — تحطها انت بنفسك</span>
      </div>
      <div id="gradesList"></div>
    </section>
   </div>

   <div id="coursePage" style="display:none;"></div>
   <div id="lecturePage" style="display:none;"></div>
  </main>
</div>

<footer>نموذج تجريبي — تفاعلي بالكامل، بدون تسجيل دخول حقيقي</footer>

<script type="module">
// ============================================================
// Firebase — لحفظ البيانات على الإنترنت عشان تتزامن بين أي جهاز
// ⚙️ حط بيانات مشروعك من Firebase Console بدل القيم دي (شوف التعليمات)
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "REPLACE_ME",
  authDomain: "REPLACE_ME",
  projectId: "REPLACE_ME",
  storageBucket: "REPLACE_ME",
  messagingSenderId: "REPLACE_ME",
  appId: "REPLACE_ME"
};

let db = null;
if(firebaseConfig.apiKey !== "REPLACE_ME"){
  try{
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  }catch(e){ console.error('تعذّر تفعيل Firebase:', e); }
}
const stateDocRef = () => doc(db, 'ufuq', 'state');

const FACULTIES = {
  nursing: {label:'🩺 كلية التمريض', short:'التمريض'},
  cs: {label:'💻 كلية الحاسبات والمعلومات', short:'الحاسبات'},
};

const THEME = {
  // ===== كلية الحاسبات والمعلومات =====
  cg:    {c:'#1B7A93', bg:'#DCF0F4', label:'الرسم بالحاسب'},
  net:   {c:'#6A4FA0', bg:'#ECE5F5', label:'شبكات الحاسب'},
  field: {c:'#557A46', bg:'#E4EEDF', label:'التدريب الميداني'},

/* ===== حفظ التعديلات: على الإنترنت (Firebase) مع نسخة احتياطية محلية ===== */
const STORAGE_KEY = 'ufuq_platform_state_v1';

function buildState(){
  const doneMap = {};
  courses.forEach(c=>{ doneMap[c.id] = c.lessons.map(l=>l.done); });
  return { assignments, nextAssignmentId, gradesData, doneMap };
}

function applyState(state){
  if(!state) return;
  if(Array.isArray(state.assignments)){
    assignments.length = 0;
    state.assignments.forEach(a=>assignments.push(a));
  }
  if(typeof state.nextAssignmentId === 'number'){
    nextAssignmentId = state.nextAssignmentId;
  }
  if(state.gradesData){
    Object.assign(gradesData, state.gradesData);
  }
  if(state.doneMap){
    courses.forEach(c=>{
      const arr = state.doneMap[c.id];
      if(arr){
        c.lessons.forEach((l,i)=>{ if(arr[i] !== undefined) l.done = arr[i]; });
      }
    });
  }
}

async function saveState(){
  const state = buildState();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('تعذّر الحفظ محليًا:', e); }
  if(db){
    try{ await setDoc(stateDocRef(), state); }
    catch(e){ console.error('تعذّر الحفظ على الإنترنت (هيفضل محفوظ على الجهاز ده بس):', e); }
  }
}

async function loadState(){
  let state = null;
  if(db){
    try{
      const snap = await getDoc(stateDocRef());
      if(snap.exists()) state = snap.data();
    }catch(e){ console.error('تعذّر التحميل من الإنترنت، هنجرب النسخة المحلية:', e); }
  }
  if(!state){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) state = JSON.parse(raw);
    }catch(e){ console.error('تعذّر تحميل البيانات المحفوظة محليًا:', e); }
  }
  applyState(state);
}

const gradesData = {};

function getCourseGrades(courseId){
  if(!gradesData[courseId]){
    gradesData[courseId] = {
      quiz:    {score:'', max:20},
      midterm: {score:'', max:30},
      final:   {score:'', max:50},
    };
  }
  return gradesData[courseId];
}

function computeTotal(g){
  const parts = ['quiz','midterm','final'];
  let scoreSum = 0, maxSum = 0;
  parts.forEach(p=>{
    const s = parseFloat(g[p].score);
    const m = parseFloat(g[p].max);
    if(!isNaN(m) && m > 0) maxSum += m;
    if(!isNaN(s)) scoreSum += s;
  });
  if(maxSum === 0) return null;
  return {scoreSum, maxSum, pct: Math.round((scoreSum/maxSum)*100)};
}

function gradeRowHtml(courseId, part, label, obj){
  return `
    <div class="grade-row">
      <span class="grade-label">${label}</span>
      <input type="number" class="grade-input" placeholder="الدرجة" value="${obj.score}" data-grade="${courseId}|${part}|score" inputmode="decimal">
      <span class="grade-slash">/</span>
      <input type="number" class="grade-input small" placeholder="من" value="${obj.max}" data-grade="${courseId}|${part}|max" inputmode="decimal">
    </div>`;
}

function renderGrades(facCourses){
  const list = facCourses || courses.filter(c=>c.faculty===currentFaculty);
  const wrap = document.getElementById('gradesList');
  if(!wrap) return;
  if(list.length === 0){
    wrap.innerHTML = `<div class="cp-empty">مفيش مواد لعرض درجاتها</div>`;
    return;
  }

  wrap.innerHTML = list.map(course=>{
    const th = THEME[course.subject];
    const g = getCourseGrades(course.id);
    const total = computeTotal(g);
    return `
      <div class="grade-card" style="--gc:${th.c}; --gcbg:${th.bg}">
        <div class="grade-card-head">
          <span class="grade-course-title">${course.title}</span>
          <span class="grade-total" id="total-${course.id}">${total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—'}</span>
        </div>
        <div class="grade-rows">
          ${gradeRowHtml(course.id, 'quiz', 'كويزات', g.quiz)}
          ${gradeRowHtml(course.id, 'midterm', 'ميد تيرم', g.midterm)}
          ${gradeRowHtml(course.id, 'final', 'فاينال', g.final)}
        </div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('[data-grade]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const [courseId, part, field] = inp.dataset.grade.split('|');
      gradesData[courseId][part][field] = inp.value;
      const total = computeTotal(gradesData[courseId]);
      const totalEl = document.getElementById(`total-${courseId}`);
      if(totalEl) totalEl.textContent = total ? `${total.scoreSum} / ${total.maxSum} (${total.pct}%)` : '—';
      saveState();
    });
  });
}

function wireLectureList(course){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.lecture-check')) return;
      openLecture(course, +el.dataset.open);
    });
  });
  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = +el.dataset.check;
      course.lessons[i].done = el.checked;
      renderCourses();
      document.getElementById('lectureList').innerHTML = lecturesHtml(course);
      wireLectureList(course);
      document.getElementById('cpPct').textContent = pct(course) + '%';
      document.getElementById('cpProgressFill').style.width = pct(course) + '%';
      saveState();
    });
  });
}

  lecturePage.innerHTML = `
    <button class="back-btn" id="lectureBack">→ رجوع لـ ${course.title}</button>
    <div class="lecture-hero">
      <input type="checkbox" class="lecture-check" id="heroCheck" ${l.done?'checked':''}>
      <div>
        <h2 id="heroTitle" class="${l.done?'done':''}">${l.t}</h2>
        <div class="sub">${course.code} · ${l.d}</div>
      </div>
    </div>
    <div id="lectureContent">${lectureContentHtml(course, l, li)}</div>
  `;

  lecturePage.querySelector('#lectureBack').addEventListener('click', ()=>openCourse(course.id));
  lecturePage.querySelector('#heroCheck').addEventListener('change', (e)=>{
    l.done = e.target.checked;
    document.getElementById('heroTitle').classList.toggle('done', l.done);
    renderCourses();
    saveState();
  });

  wireLectureContent(course, li);
  window.scrollTo({top:0, behavior:'smooth'});
}

function refreshLectureContent(course, li){
  document.getElementById('lectureContent').innerHTML = lectureContentHtml(course, course.lessons[li], li);
  wireLectureContent(course, li);
}

function wireLectureContent(course, li){
  const l = course.lessons[li];
  const pdfInput = document.getElementById('pdfInput');
  const audioInput = document.getElementById('audioInput');
  document.getElementById('pdfUploadBtn').addEventListener('click', ()=>pdfInput.click());
  document.getElementById('audioUploadBtn').addEventListener('click', ()=>audioInput.click());
  pdfInput.addEventListener('change', (e)=>handlePdfUpload(e, course, li));
  audioInput.addEventListener('change', (e)=>handleAudioUpload(e, course, li));
  const objSubmit = document.querySelector('[data-obj-submit]');
  if(objSubmit) objSubmit.addEventListener('click', ()=>gradeObjective(course, li));
  document.querySelectorAll('[data-reveal-essay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.getElementById(`essayPoints-${el.dataset.revealEssay}`).style.display = 'block';
      el.style.display = 'none';
    });
  });
  document.querySelectorAll('[data-reveal-term]').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.getElementById(`termDef-${el.dataset.revealTerm}`).style.display = 'block';
      el.style.display = 'none';
    });
  });
}

function closeLecture(course){
  document.getElementById('lecturePage').style.display = 'none';
  openCourse(course.id);
}

/* ===== PDF / audio upload (PDF sent as base64 directly to Claude — no client-side extraction) ===== */

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('تعذّرت قراءة الملف'));
    reader.readAsDataURL(file);
  });
}

async function handlePdfUpload(e, course, li){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('uploadStatus');

  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    statusEl.textContent = 'الملف ده مش PDF، اختار ملف بصيغة .pdf';
    return;
  }
  if(file.size > 25 * 1024 * 1024){
    statusEl.textContent = 'الملف كبير أكتر من اللازم (الحد الأقصى ٢٥ ميجا لهذا النموذج).';
    return;
  }

  statusEl.textContent = 'جارٍ رفع الملف…';
  try{
    const base64 = await fileToBase64(file);
    const url = URL.createObjectURL(file);
    course.lessons[li].pdf = {name:file.name, url, base64};
    course.lessons[li].quiz = null;
    statusEl.textContent = '';
    refreshLectureContent(course, li);
  }catch(err){
    console.error('PDF upload failed:', err);
    statusEl.textContent = 'حصل خطأ أثناء رفع الملف: ' + err.message;
  }
}

function handleAudioUpload(e, course, li){
  const file = e.target.files[0];
  if(!file) return;
  course.lessons[li].audio = {name:file.name, url: URL.createObjectURL(file)};
  refreshLectureContent(course, li);
}

/* ===== Quiz rendering & grading (kept for display purposes if a quiz object is ever set) ===== */

function renderFullQuizHtml(quiz){
  const mcqHtml = quiz.mcq.map((q,qi)=>`
    <div class="quiz-q" data-kind="mcq" data-qi="${qi}">
      <div class="q-text">${qi+1}. ${q.question}</div>
      ${q.options.map((opt,oi)=>`
        <label class="q-opt">
          <input type="radio" name="mcq-${qi}" value="${oi}"> ${opt}
        </label>
      `).join('')}
    </div>
  `).join('');

  const tfHtml = quiz.tf.map((q,ti)=>`
    <div class="quiz-q" data-kind="tf" data-ti="${ti}">
      <div class="q-text">${ti+1}. ${q.statement}</div>
      <label class="q-opt"><input type="radio" name="tf-${ti}" value="true"> صح</label>
      <label class="q-opt"><input type="radio" name="tf-${ti}" value="false"> خطأ</label>
    </div>
  `).join('');

  const essayHtml = quiz.essay.map((q,ei)=>`
    <div class="quiz-q">
      <div class="q-text">${ei+1}. ${q.question}</div>
      <textarea class="essay-box" rows="3" placeholder="اكتب إجابتك هنا للمراجعة الذاتية…"></textarea>
      <button class="reveal-btn" data-reveal-essay="${ei}">إظهار النقاط المتوقعة</button>
      <ul class="reveal-box" id="essayPoints-${ei}" style="display:none">
        ${q.points.map(p=>`<li>${p}</li>`).join('')}
      </ul>
    </div>
  `).join('');

  const termsHtml = quiz.terms.map((t,ti)=>`
    <div class="term-card">
      <div class="term-name">${t.term}</div>
      <button class="reveal-btn" data-reveal-term="${ti}">إظهار التعريف</button>
      <div class="reveal-box" id="termDef-${ti}" style="display:none">${t.definition}</div>
    </div>
  `).join('');

  return `
    <div class="quiz-block">
      <h4 class="quiz-h">القسم الأول — اختيار من متعدد (${quiz.mcq.length})</h4>
      ${mcqHtml}
      <h4 class="quiz-h">القسم الثاني — صح أو خطأ (${quiz.tf.length})</h4>
      ${tfHtml}
      <button class="quiz-submit" data-obj-submit="1">تسليم القسم الموضوعي</button>
      <div class="quiz-score" id="quizScore"></div>

      <h4 class="quiz-h">القسم الثالث — أسئلة مقالية</h4>
      ${essayHtml}

      <h4 class="quiz-h">القسم الرابع — مصطلحات</h4>
      <div class="terms-grid">${termsHtml}</div>
    </div>`;
}

function gradeObjective(course, li){
  const quiz = course.lessons[li].quiz;
  let correct = 0, total = quiz.mcq.length + quiz.tf.length;

  quiz.mcq.forEach((q, qi)=>{
    const selected = document.querySelector(`input[name="mcq-${qi}"]:checked`);
    const optsEls = document.querySelectorAll(`.quiz-q[data-kind="mcq"][data-qi="${qi}"] .q-opt`);
    optsEls.forEach((el, oi)=>{
      if(oi === q.answerIndex) el.classList.add('correct');
      else if(selected && +selected.value === oi) el.classList.add('wrong');
    });
    if(selected && +selected.value === q.answerIndex) correct++;
  });

  quiz.tf.forEach((q, ti)=>{
    const selected = document.querySelector(`input[name="tf-${ti}"]:checked`);
    const optsEls = document.querySelectorAll(`.quiz-q[data-kind="tf"][data-ti="${ti}"] .q-opt`);
    const correctVal = q.answer ? 'true' : 'false';
    optsEls.forEach(el=>{
      const val = el.querySelector('input').value;
      if(val === correctVal) el.classList.add('correct');
      else if(selected && selected.value === val) el.classList.add('wrong');
    });
    if(selected && selected.value === correctVal) correct++;
  });

  document.getElementById('quizScore').textContent = `النتيجة: ${correct} من ${total}`;
}

}

function renderAssignments(){
  const list = document.getElementById('assignList');
  const facAssignments = assignments.filter(a=>a.faculty===currentFaculty);
  if(facAssignments.length === 0){
    list.innerHTML = `<div class="cp-empty">مفيش واجبات دلوقتي — دوس "إضافة واجب" لو عايز تضيف واحد</div>`;
  }else{
    list.innerHTML = facAssignments.map(a=>`
      <div class="assign">
        <div class="info">
          <span class="a-title">${a.title}</span>
          <span class="a-course">${a.course}</span>
        </div>
        <div class="a-right">
          <span class="due" style="color:${a.urgent?'#B0522D':'#5B6472'}">${a.due}</span>
          <button class="a-delete" data-del-assign="${a.id}" title="حذف">✕</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-del-assign]').forEach(btn=>{
      btn.addEventListener('click', ()=>deleteAssignment(+btn.dataset.delAssign));
    });
  }
  document.getElementById('dueStat').textContent = facAssignments.length;
}

function deleteAssignment(id){
  const idx = assignments.findIndex(a=>a.id===id);
  if(idx !== -1) assignments.splice(idx, 1);
  renderAssignments();
  saveState();
}

function openAssignForm(){
  const facCourses = courses.filter(c=>c.faculty===currentFaculty);
  const formEl = document.getElementById('assignForm');
  formEl.innerHTML = `
    <input type="text" id="newAssignTitle" placeholder="عنوان الواجب">
    <select id="newAssignCourse">
      ${facCourses.map(c=>`<option value="${c.title}">${c.title}</option>`).join('')}
    </select>
    <input type="text" id="newAssignDue" placeholder="تاريخ التسليم (مثلاً: 30 أغسطس)">
    <label><input type="checkbox" id="newAssignUrgent"> عاجل</label>
    <div class="form-actions">
      <button class="btn-save" id="saveAssignBtn">حفظ</button>
      <button class="btn-cancel" id="cancelAssignBtn">إلغاء</button>
    </div>
  `;
  formEl.style.display = 'flex';
  document.getElementById('saveAssignBtn').addEventListener('click', saveNewAssignment);
  document.getElementById('cancelAssignBtn').addEventListener('click', closeAssignForm);
}

function closeAssignForm(){
  document.getElementById('assignForm').style.display = 'none';
  document.getElementById('assignForm').innerHTML = '';
}

function saveNewAssignment(){
  const title = document.getElementById('newAssignTitle').value.trim();
  const course = document.getElementById('newAssignCourse').value;
  const due = document.getElementById('newAssignDue').value.trim();
  const urgent = document.getElementById('newAssignUrgent').checked;

  if(!title || !due){
    alert('اكتب عنوان الواجب وتاريخ التسليم');
    return;
  }

  assignments.push({id: nextAssignmentId++, title, course, faculty: currentFaculty, due, urgent});
  closeAssignForm();
  renderAssignments();
  saveState();
}

document.getElementById('addAssignBtn').addEventListener('click', ()=>{
  const formEl = document.getElementById('assignForm');
  if(formEl.style.display === 'flex'){ closeAssignForm(); }
  else{ openAssignForm(); }
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');

    // لو مفتوح صفحة مادة/محاضرة، ارجع للوحة التحكم الأول
    document.getElementById('coursePage').style.display = 'none';
    document.getElementById('lecturePage').style.display = 'none';
    document.getElementById('dashboardView').style.display = 'block';

    const targetId = tab.dataset.tab;
    if(targetId === 'dashboard'){
      window.scrollTo({top:0, behavior:'smooth'});
    }else{
      const el = document.getElementById(targetId);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
});

  await loadState();
  renderFacultySwitch();

  renderTimeline();
  renderAssignments();
}
initApp();
